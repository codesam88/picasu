[graph]
targets = []

[advisories]
version = 2
ignore = [
    # quick-xml <0.41.0 has quadratic duplicate-attribute checking on a start
    # tag (RUSTSEC-2026-0194) and unbounded namespace-declaration allocation in
    # NsReader (RUSTSEC-2026-0195); both are denial-of-service shaped and need
    # a single start tag carrying a very large number of attributes or
    # declarations. The tree carries quick-xml 0.40.1, pulled in by xmpkit
    # 0.1.6 (its dependency requirement is `^0.40`), so there is no upgrade
    # until xmpkit ships a release on >=0.41. xmpkit parses the XMP packets
    # the backend reads from indexed media files and sidecars. Revisit when
    # xmpkit bumps quick-xml.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # h2 <0.4.16 accepts unbounded empty DATA frames (resource-exhaustion DoS,
    # low severity). h2 0.3.x is not patched (fix is >=0.4.16 only); hyper 0.14
    # and rocket_http 0.5.1 pin h2 ^0.3, and rocket 0.5.1 is the newest release
    # with no path to hyper 1.x / h2 0.4 yet. Rocket 0.5 negotiates HTTP/2 only
    # over TLS (ALPN h2) and this server runs plaintext with no TLS configured,
    # so the h2 code path is never active at runtime. Revisit when upstream
    # rocket moves to hyper 1.x or if TLS support is added.
    "RUSTSEC-2026-0258",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "NCSA",
    "CDLA-Permissive-2.0", # webpki-roots (TLS root certificates), via ureq v3
]

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
