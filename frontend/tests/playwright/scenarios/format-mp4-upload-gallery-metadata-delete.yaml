name: MP4 upload renders in the gallery, shows metadata, and deletes
# MP4/MOV capability group, end to end through the UI. The bytes come from the
# pinned manifest fixture `mp4-48x32-ffprobe` (utils/snapfab/fixtures/mp4/),
# because snapfab cannot encode video: the UI harness `given` step otherwise
# only produces jpeg/png. Metadata for a video comes from ffprobe, so this
# scenario is as environment-sensitive as the API layer's video scenarios —
# a missing ffmpeg/ffprobe fails the run with the backend's own diagnostic
# rather than passing silently.
#
# What is asserted is UI-visible state only, never parser output: that the grid
# grows a tile, that the row is a *video* row, that the sidepane prints the
# stored filename including its `.mp4` extension, and the frame dimensions the
# sidepane renders. The row type is probed through the photo menu instead of the
# view page's `<video>` element: a video row is inserted `pending` and the
# frontend only clears that once a later fetch sees the finished transcode, so
# whether `<video>` is on screen depends on which side of that race the click
# lands. `Rotate Left` is gated on `database.type === 'image'` alone, so its
# absence is the same fact without the race. The ffprobe field map, the
# `TAG:major_brand` that distinguishes MP4 from QuickTime, and the thumbnail on
# disk are asserted in the API layer
# (mp4_ffprobe_metadata_dimensions_thumbnail and its negative control).
#
# The trashed grid is asserted to empty after the permanent delete. It is not
# asserted that the video's `.jpg` thumbnail left the disk: no scenario on this
# branch pins thumbnail cleanup when a video is deleted, so pinning it here
# would freeze an unsettled behaviour.
covers:
  api:
    - POST /upload
    - PUT /put/edit_flags
    - DELETE /delete/delete-data
  ui:
    - Info
    - .desktop-small-image
    - '.v-list-item:has-text("Rotate Left")'
    - picasu-mp4-48x32-ffprobe.mp4
    - 48 × 32
given:
  # The empty-library state opens a "Database is empty, scan now or upload?"
  # dialog over the navbar, so the upload button is unreachable until something
  # is indexed. One seeded JPEG keeps the timeline non-empty, exactly as the
  # upload-options scenarios do; it is a different format from the item under
  # test, and the album grid below is how the two are told apart.
  - photo: seed/img01.jpg
  - source_file: 'picasu-mp4-48x32-ffprobe.mp4'
    fixture: mp4-48x32-ffprobe
    id_as: $src_mp4
steps:
  # ── upload ──────────────────────────────────────────────────────────────
  - when:
      - navigate: /timeline
    assert:
      - ui.modal: closed
      - ui.count: .desktop-small-image
        equals: 1

  - when:
      - upload.files:
          trigger: icon/mdi-upload
          files: ['${src_mp4}']
    assert:
      - ui.modal: open
      - ui.text_visible: picasu-mp4-48x32-ffprobe.mp4

  - when:
      - click: button/Upload
    assert:
      - ui.toast:
          type: success
          contains: Files uploaded successfully
      - ui.modal: closed

  # ── gallery rendering: the uploaded tile joins the seeded one ───────────
  - when:
      - navigate: /timeline
    assert:
      - ui.count: .desktop-small-image
        equals: 2

  # ── the item under test, on its own: the album the upload landed in ─────
  # The timeline also holds the seed, and `click.first` would be a coin flip
  # between them. An upload with no target album lands in the configured
  # `uploadFolder` under the image path, which is a top-level album of its own,
  # so that grid holds exactly the item under test and `click.first` is
  # unambiguous.
  - when:
      - navigate: /albums
    assert:
      - ui.visible: main/

  - when:
      - click.text: Uploads
    assert:
      - ui.count: .desktop-small-image
        equals: 1

  # ── metadata sidepane ───────────────────────────────────────────────────
  - when:
      - click.first: true
    assert:
      - ui.visible: main/

  - when:
      - click.icon: mdi-information-outline
    assert:
      - ui.text_visible: Info
      - ui.sidebar_visible: picasu-mp4-48x32-ffprobe.mp4
      - ui.sidebar_visible: 48 × 32

  # The photo menu offers `Rotate Left` only for an image row, so its absence is
  # the row type, read from the menu instead of the racy display element.
  - when:
      - click.testid: photo-menu
    assert:
      - ui.visible: main/
      - ui.count: '.v-list-item:has-text("Rotate Left")'
        equals: 0

  # ── deletion: soft delete removes the tile from the grid ────────────────
  - when:
      - click: option/Delete
    assert:
      - ui.visible: main/

  - when:
      - navigate: /timeline
    assert:
      - ui.count: .desktop-small-image
        equals: 1

  # The seed was never trashed, so the single trash tile is the item under test.
  - when:
      - navigate: /trashed
    assert:
      - ui.count: .desktop-small-image
        equals: 1

  # ── deletion: permanent delete empties the trash grid ───────────────────
  - when:
      - click.first: true
    assert:
      - ui.visible: main/

  - when:
      - click.icon: mdi-information-outline
    assert:
      - ui.text_visible: Info
      - ui.sidebar_visible: picasu-mp4-48x32-ffprobe.mp4

  - when:
      - click.testid: photo-menu
    assert:
      - ui.visible: main/

  - when:
      - click: option/Permanently Delete
    assert:
      - ui.toast:
          type: success
          contains: Successfully deleted data

  # The empty-state card is the wait that makes the count non-vacuous: it renders
  # only once the view has loaded with zero rows, and `ui.count` with 0 also
  # matches a grid that has not rendered yet, so a count on its own would pass
  # whether or not the delete had happened.
  - when:
      - navigate: /trashed
    assert:
      - ui.text_visible: Deleted photos and videos appear here.
      - ui.count: .desktop-small-image
        equals: 0
