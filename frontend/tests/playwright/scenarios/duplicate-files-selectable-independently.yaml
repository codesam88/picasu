name: duplicate files can be selected independently
covers:
  api:
    - POST /upload
  ui:
    - upload.files
    - independent duplicate grid items
    - independent selection of duplicates

given:
  - photo: duplicate-select/seed.jpg
  - source_file: 'duplicate-select.jpg'
    format: jpeg
    width: 64
    height: 64
    id_as: $duplicate

steps:
  - when:
      - navigate: /timeline
    assert:
      - ui.count: .desktop-small-image
        equals: 1

  # Upload the same file twice to create duplicates
  - when:
      - upload.files:
          trigger: icon/mdi-upload
          files: ['${duplicate}', '${duplicate}']
    assert:
      - ui.modal: open

  - when:
      - click: button/Upload
    assert:
      - ui.toast:
          type: success
          contains: Files uploaded successfully
      - ui.modal: closed

  # Re-enter the route to force a fresh frontend data load
  - when:
      - navigate: /timeline
    assert:
      - ui.count: .desktop-small-image
        equals: 3

  # Click on the first duplicate image
  - when:
      - click.first: true
    assert:
      - ui.route: /view/

  # Verify we can navigate back and click on a different duplicate
  - when:
      - navigate: /timeline
    assert:
      - ui.count: .desktop-small-image
        equals: 3

  # Click on the first image again (which could be a different duplicate after refresh)
  - when:
      - click.first: true
    assert:
      - ui.route: /view/
