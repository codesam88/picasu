name: Config unsaved changes revert on re-entry
covers:
  api:
    - GET /get/config
  ui:
    - Backend watches filesystem for modifications.
    - Backend filesystem watcher is unavailable / disabled.
given:
  - user:
      user_id: admin
      password: e2e_test_pwd

steps:
  - when:
      - login:
          user: admin
          password: e2e_test_pwd
    assert:
      - ui.route: /timeline
  - when:
      - navigate: /config
    assert:
      - ui.text_visible: Backend watches filesystem for modifications.

  - when:
      - click: checkbox/Filesystem watcher
    assert:
      - ui.text_visible: Backend filesystem watcher is unavailable / disabled.

  - when:
      - navigate: /timeline
      - navigate: /config
    assert:
      - ui.text_visible: Backend watches filesystem for modifications.
