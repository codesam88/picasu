name: Photo with aliases in album and trash appears in both views
covers:
  ui:
    - Photo visible in album before delete
    - Photo visible in /trashed after delete
    - Photo absent from album after delete

given:
  - dir_album: aliascheck/pool

  - photo: aliascheck/pool/img01.jpg

steps:
  - when:
      - navigate: /albums
    assert:
      - ui.visible: main/

  - when:
      - click.text: aliascheck
    assert:
      - ui.visible: main/

  - when:
      - click.text: pool
    assert:
      - ui.visible: main/

  - when:
      - click.first: true
    assert:
      - ui.visible: main/

  - when:
      - click.icon: mdi-information-outline
    assert:
      - ui.visible: main/

  - when:
      - click.testid: photo-menu
    assert:
      - ui.visible: main/

  - when:
      - click: option/Delete
    assert:
      - ui.toast:
          type: success
          contains: Successfully deleted data

  - when:
      - navigate: /trashed
    assert:
      - ui.visible: main/

  - when:
      - navigate: /albums
    assert:
      - ui.visible: main/

  - when:
      - click.text: aliascheck
    assert:
      - ui.visible: main/

  - when:
      - click.text: pool
    assert:
      - ui.visible: main/
