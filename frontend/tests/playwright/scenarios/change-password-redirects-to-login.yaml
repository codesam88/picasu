name: Password change redirects to login
covers:
  api:
    - PUT /put/users/password
  ui:
    - modal:open
    - modal:closed
    - route:/login
    - route:/timeline
given:
  - empty: true
  - user:
      user_id: admin
      password: e2e_test_pwd
  - photo: /library/photo.jpg
  - index: '/'
steps:
  - when:
      - login:
          user: admin
          password: e2e_test_pwd
    assert:
      - ui.route: /timeline
  - when:
      - click.icon: mdi-account-circle
      - click.testid: user-menu-settings
    assert:
      - ui.modal: open
      - ui.text_visible: Change Password
  - when:
      - fill: textbox/Current Password
        value: e2e_test_pwd
      - fill: textbox/New Password
        value: e2e_test_pwd2
      - fill: textbox/Confirm New Password
        value: e2e_test_pwd2
      - click: button/Change Password
    assert:
      - ui.modal: closed
      - ui.route: /login
  - when:
      - fill: textbox/User ID
        value: admin
      - fill: textbox/Password
        value: e2e_test_pwd2
      - click: button/Login
    assert:
      - ui.route: /timeline
