name: Permanently delete from trash removes photo entirely
covers:
  api:
    - DELETE /delete/delete-data
  ui:
    - Permanently Delete menu item removes photo from trash
    - Photo absent from /trashed after permanent delete

given:
  - dir_album: permdel/pool

  - photo: permdel/pool/img01.jpg

steps:
  - when:
      - navigate: /albums
    assert:
      - ui.visible: main/

  - when:
      - click.text: permdel
    assert:
      - ui.visible: main/

  - when:
      - click.text: pool
    assert:
      - ui.visible: main/

  - when:
      - click.first: true
    assert:
      - ui.visible: main/

  - when:
      - click.icon: mdi-information-outline
    assert:
      - ui.visible: main/

  - when:
      - click.testid: photo-menu
    assert:
      - ui.visible: main/

  - when:
      - click: option/Delete
    assert:
      - ui.toast:
          type: success
          contains: Successfully deleted data

  - when:
      - navigate: /trashed
    assert:
      - ui.visible: main/

  - when:
      - click.first: true
    assert:
      - ui.visible: main/

  - when:
      - click.icon: mdi-information-outline
    assert:
      - ui.visible: main/

  - when:
      - click.testid: photo-menu
    assert:
      - ui.visible: main/

  - when:
      - click: option/Permanently Delete
    assert:
      - ui.toast:
          type: success
          contains: Successfully deleted data

  - when:
      - navigate: /trashed
    assert:
      - ui.visible: main/
