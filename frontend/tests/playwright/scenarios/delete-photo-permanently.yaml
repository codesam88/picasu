name: Soft-delete then permanently delete removes photo from library
covers:
  api:
    - PUT /put/edit_flags
    - DELETE /delete/delete-data
  ui:
    - .desktop-small-image

given:
  - user:
      user_id: admin
      password: e2e_test_pwd
  - dir_album: deletetest/pool

  - photo: deletetest/pool/img01.jpg
  - index: '/'

steps:
  - when:
      - login:
          user: admin
          password: e2e_test_pwd
    assert:
      - ui.route: /timeline
  - when:
      - navigate: /albums
    assert:
      - ui.visible: main/

  - when:
      - click.text: deletetest
    assert:
      - ui.visible: main/

  - when:
      - click.text: pool
    assert:
      - ui.visible: main/

  - when:
      - click.first: true
    assert:
      - ui.visible: main/

  # The info sidepane (and its menu) is opt-in now.
  - when:
      - click.icon: mdi-information-outline
    assert:
      - ui.visible: main/

  # Soft-delete via the three-dot menu
  - when:
      - click.testid: photo-menu
    assert:
      - ui.visible: main/

  - when:
      - click: option/Delete
    assert:
      - ui.visible: main/

  # Navigate to trash — the photo should be there
  - when:
      - navigate: /trashed
    assert:
      - ui.visible: main/

  # Open the trashed photo
  - when:
      - click.first: true
    assert:
      - ui.visible: main/

  # The info sidepane (and its menu) is opt-in now.
  - when:
      - click.icon: mdi-information-outline
    assert:
      - ui.visible: main/

  # Permanently delete via the three-dot menu
  - when:
      - click.testid: photo-menu
    assert:
      - ui.visible: main/

  - when:
      - click: option/Permanently Delete
    assert:
      - ui.toast:
          type: success
          contains: Successfully deleted data

  # The trash grid should now be empty — the file left the trashed grid, not just the toast.
  - when:
      - navigate: /trashed
    assert:
      - ui.count: .desktop-small-image
        equals: 0
