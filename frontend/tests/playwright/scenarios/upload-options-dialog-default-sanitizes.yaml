name: Upload with default auto-rename on sanitizes unsafe filename and succeeds
covers:
  api:
    - POST /upload
  ui:
    - toast:success:Files uploaded successfully
given:
  - user:
      user_id: admin
      password: e2e_test_pwd
  - photo: seed/img01.jpg
  - source_file: 'bad:name.jpg'
    format: jpeg
    width: 64
    height: 64
    id_as: $src_unsafe
  - index: '/'

steps:
  - when:
      - login:
          user: admin
          password: e2e_test_pwd
    assert:
      - ui.route: /timeline
  - when:
      - navigate: /timeline
    assert:
      - ui.modal: closed

  - when:
      - upload.files:
          trigger: icon/mdi-upload
          files: ['${src_unsafe}']
    assert:
      - ui.modal: open
      - ui.text_visible: bad:name.jpg

  - when:
      - click: button/Upload
    assert:
      - ui.toast:
          type: success
          contains: Files uploaded successfully
      - ui.modal: closed
