name: Upload with auto-rename off accepts a safe filename and succeeds
covers:
  api:
    - POST /upload
  ui:
    - toast:success:Files uploaded successfully
given:
  - user:
      user_id: admin
      password: e2e_test_pwd
  - photo: seed/img01.jpg
  - source_file: 'safe-name.jpg'
    format: jpeg
    width: 64
    height: 64
    id_as: $src_safe
  - index: '/'

steps:
  - when:
      - login:
          user: admin
          password: e2e_test_pwd
    assert:
      - ui.route: /timeline
  - when:
      - navigate: /timeline
    assert:
      - ui.modal: closed

  - when:
      - upload.files:
          trigger: icon/mdi-upload
          files: ['${src_safe}']
    assert:
      - ui.modal: open

  - when:
      - set.auto_rename: false
    assert:
      - ui.modal: open

  - when:
      - click: button/Upload
    assert:
      - ui.toast:
          type: success
          contains: Files uploaded successfully
      - ui.modal: closed
