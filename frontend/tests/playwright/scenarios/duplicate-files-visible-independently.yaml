name: identical uploaded files remain independently visible after refresh
covers:
  api:
    - POST /upload
  ui:
    - upload.files
    - independent duplicate grid items
    - refresh preserves duplicate items

given:
  - photo: duplicate-ui/seed.jpg
  - source_file: 'duplicate-ui.jpg'
    format: jpeg
    width: 64
    height: 64
    id_as: $duplicate

steps:
  - when:
      - navigate: /timeline
    assert:
      - ui.count: .desktop-small-image
        equals: 1

  # Select the same byte-identical source twice. Upload conflict handling
  # should create two physical files with distinct names.
  - when:
      - upload.files:
          trigger: icon/mdi-upload
          files: ['${duplicate}', '${duplicate}']
    assert:
      - ui.modal: open

  - when:
      - click: button/Upload
    assert:
      - ui.toast:
          type: success
          contains: Files uploaded successfully
      - ui.modal: closed

  # Re-enter the route to force a fresh frontend data load.
  - when:
      - navigate: /timeline
    assert:
      - ui.count: .desktop-small-image
        equals: 3
