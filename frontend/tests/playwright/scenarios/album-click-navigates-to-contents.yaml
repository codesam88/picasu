name: Clicking album tile navigates to album contents with child media
covers:
  ui:
    - route:/album/[a-z0-9]+$
    - .parent
given:
  - user:
      user_id: admin
      password: e2e_test_pwd
  - dir_album: navtestalbum
  - photo: navtestalbum/child.jpg
  - index: '/'

steps:
  - when:
      - login:
          user: admin
          password: e2e_test_pwd
    assert:
      - ui.route: /timeline
  - when:
      - navigate: /albums
    assert:
      - ui.visible: main/

  - when:
      - click.text: Navtestalbum
    assert:
      - ui.route: /album/[a-z0-9]+$
      - ui.count: .parent
        equals: 1
