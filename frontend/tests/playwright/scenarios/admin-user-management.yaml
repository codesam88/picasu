name: Admin user management panel visible after login
covers:
  api:
    - POST /post/users/authenticate
    - POST /post/users/bootstrap
    - GET /get/users
  ui:
    - textbox/User ID
    - route:/timeline
    - route:/config
given:
  - empty: true
  - user:
      user_id: admin
      password: e2e_test_pwd
steps:
  - when:
      - navigate: /login
    assert:
      - ui.visible: textbox/User ID
      - ui.visible: textbox/Password
  - when:
      - fill: textbox/User ID
        value: admin
      - fill: textbox/Password
        value: e2e_test_pwd
      - click: button/Login
    assert:
      - ui.route: /timeline
  - when:
      - navigate: /config
      - click: tab/Administration
    assert:
      - ui.route: /config
      - ui.text_visible: User Management
      - ui.text_visible: admin
      - ui.disabled: button/Cannot demote admin - promote another user first
      - ui.disabled: button/Cannot delete admin - promote another user first
