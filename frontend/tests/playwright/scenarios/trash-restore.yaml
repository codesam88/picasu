name: Restore from trash via album dialog returns photo out of trash
covers:
  api:
    - PUT /put/assign_album
  ui:
    - Restore menu item opens the album dialog prefilled to original album
    - Confirming restore removes photo from trash view and reappears on timeline

given:
  - dir_album: restoretest/pool

  - photo: restoretest/pool/img01.jpg

steps:
  - when:
      - navigate: /albums
    assert:
      - ui.visible: main/

  - when:
      - click.text: restoretest
    assert:
      - ui.visible: main/

  - when:
      - click.text: pool
    assert:
      - ui.visible: main/

  - when:
      - click.first: true
    assert:
      - ui.visible: main/

  - when:
      - click.icon: mdi-information-outline
    assert:
      - ui.visible: main/

  - when:
      - click.testid: photo-menu
    assert:
      - ui.visible: main/

  - when:
      - click: option/Delete
    assert:
      - ui.toast:
          type: success
          contains: Successfully deleted data

  - when:
      - navigate: /trashed
    assert:
      - ui.visible: main/

  - when:
      - click.first: true
    assert:
      - ui.visible: main/

  - when:
      - click.icon: mdi-information-outline
    assert:
      - ui.visible: main/

  - when:
      - click.testid: photo-menu
    assert:
      - ui.visible: main/

  # Restore opens the album-selection dialog prefilled to the source album;
  # confirming the default target moves the photo back out of .trash/.
  - when:
      - click: option/Restore
    assert:
      - ui.modal: open

  - when:
      - click: button/Restore
    assert:
      - ui.toast:
          type: success
          contains: Moved to album

  - when:
      - navigate: /trashed
    assert:
      - ui.visible: main/

  - when:
      - navigate: /timeline
    assert:
      - ui.visible: main/
