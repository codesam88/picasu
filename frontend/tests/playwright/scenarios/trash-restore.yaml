name: Restore from trash returns photo to original location
covers:
  api:
    - PUT /put/restore-from-trash
  ui:
    - Restore menu item removes photo from trash view
    - Photo reappears on /timeline after restore

given:
  - dir_album: restoretest/pool

  - photo: restoretest/pool/img01.jpg

steps:
  - when:
      - navigate: /albums
    assert:
      - ui.visible: main/

  - when:
      - click.text: restoretest
    assert:
      - ui.visible: main/

  - when:
      - click.text: pool
    assert:
      - ui.visible: main/

  - when:
      - click.first: true
    assert:
      - ui.visible: main/

  - when:
      - click.icon: mdi-information-outline
    assert:
      - ui.visible: main/

  - when:
      - click.testid: photo-menu
    assert:
      - ui.visible: main/

  - when:
      - click: option/Delete
    assert:
      - ui.toast:
          type: success
          contains: Successfully deleted data

  - when:
      - navigate: /trashed
    assert:
      - ui.visible: main/

  - when:
      - click.first: true
    assert:
      - ui.visible: main/

  - when:
      - click.icon: mdi-information-outline
    assert:
      - ui.visible: main/

  - when:
      - click.testid: photo-menu
    assert:
      - ui.visible: main/

  - when:
      - click: option/Restore
    assert:
      - ui.toast:
          type: success
          contains: Successfully restored data

  - when:
      - navigate: /trashed
    assert:
      - ui.visible: main/
