name: Login handling covers all states
covers:
  api:
    - POST /post/authenticate
    - POST /post/users/bootstrap
  ui:
    - textbox/User ID
    - textbox/Password
    - route:/timeline
    - toast:error:unauthorized
    - snapshot:login-page
given:
  - empty: true
  - user:
      user_id: admin
      password: e2e_test_pwd
steps:
  - when:
      - navigate: /login
    assert:
      - ui.visible: textbox/User ID
      - ui.visible: textbox/Password
      - ui.aria_snapshot: login-page
  - when:
      - fill: textbox/User ID
        value: admin
      - fill: textbox/Password
        value: wrong_password
      - click: button/Login
    assert:
      - ui.toast:
          type: error
          contains: unauthorized
  - when:
      - fill: textbox/User ID
        value: admin
      - fill: textbox/Password
        value: e2e_test_pwd
      - click: button/Login
    assert:
      - ui.route: /timeline
