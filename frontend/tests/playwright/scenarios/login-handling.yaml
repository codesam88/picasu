name: Login handling covers all states
covers:
  api:
    - POST /post/authenticate
    - POST /post/users/bootstrap
  ui:
    - textbox/User ID
    - textbox/Password
    - route:/timeline
    - route:/login
    - Please log in to continue
    - .v-snackbar__content
    - snapshot:login-page
session: none
given:
  - empty: true
  - user:
      user_id: admin
      password: e2e_test_pwd
steps:
  - when:
      - navigate: /login
    assert:
      - ui.visible: textbox/User ID
      - ui.visible: textbox/Password
      - ui.aria_snapshot: login-page
  - when:
      - fill: textbox/User ID
        value: admin
      - fill: textbox/Password
        value: wrong_password
      - click: button/Login
    assert:
      # 401 arrival UX per docs/auth.md: the response interceptor raises no
      # snackbar for unauthorized; the static login banner owns the message.
      - ui.route: /login
      - ui.text_visible: Please log in to continue
      - ui.count: .v-snackbar__content
        equals: 0
  - when:
      - fill: textbox/User ID
        value: admin
      - fill: textbox/Password
        value: e2e_test_pwd
      - click: button/Login
    assert:
      - ui.route: /timeline
