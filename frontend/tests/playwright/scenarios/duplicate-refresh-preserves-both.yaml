name: duplicate files survive page refresh independently
covers:
  api:
    - POST /upload
    - GET /get/get-data
  ui:
    - upload.files
    - independent duplicate grid items
    - refresh preserves duplicate items

given:
  - photo: duplicate-refresh/seed.jpg
  - source_file: 'duplicate-refresh.jpg'
    format: jpeg
    width: 64
    height: 64
    id_as: $duplicate

steps:
  - when:
      - navigate: /timeline
    assert:
      - ui.count: .desktop-small-image
        equals: 1

  # Upload the same file twice to create duplicates
  - when:
      - upload.files:
          trigger: icon/mdi-upload
          files: ['${duplicate}', '${duplicate}']
    assert:
      - ui.modal: open

  - when:
      - click: button/Upload
    assert:
      - ui.toast:
          type: success
          contains: Files uploaded successfully
      - ui.modal: closed

  # First load: verify 3 items
  - when:
      - navigate: /timeline
    assert:
      - ui.count: .desktop-small-image
        equals: 3

  # Refresh the page
  - when:
      - navigate: /timeline
    assert:
      # After refresh, all 3 items should still be present
      - ui.count: .desktop-small-image
        equals: 3

  # Second refresh to confirm stability
  - when:
      - navigate: /timeline
    assert:
      - ui.count: .desktop-small-image
        equals: 3
