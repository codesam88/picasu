name: duplicate files survive page refresh independently
covers:
  api:
    - POST /upload
    - GET /get/get-data
  ui:
    - .desktop-small-image

given:
  - user:
      user_id: admin
      password: e2e_test_pwd
  - photo: duplicate-refresh/seed.jpg
  - source_file: 'duplicate-refresh.jpg'
    format: jpeg
    width: 64
    height: 64
    id_as: $duplicate
  - index: '/'

steps:
  - when:
      - login:
          user: admin
          password: e2e_test_pwd
    assert:
      - ui.route: /timeline
  - when:
      - navigate: /timeline
    assert:
      - ui.count: .desktop-small-image
        equals: 1

  # Upload the same file twice to create duplicates
  - when:
      - upload.files:
          trigger: icon/mdi-upload
          files: ['${duplicate}', '${duplicate}']
    assert:
      - ui.modal: open

  - when:
      - click: button/Upload
    assert:
      - ui.toast:
          type: success
          contains: Files uploaded successfully
      - ui.modal: closed

  # First load: verify 3 items
  - when:
      - navigate: /timeline
    assert:
      - ui.count: .desktop-small-image
        equals: 3

  # Refresh the page
  - when:
      - navigate: /timeline
    assert:
      # After refresh, all 3 items should still be present
      - ui.count: .desktop-small-image
        equals: 3

  # Second refresh to confirm stability
  - when:
      - navigate: /timeline
    assert:
      - ui.count: .desktop-small-image
        equals: 3
