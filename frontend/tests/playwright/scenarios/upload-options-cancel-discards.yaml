name: Cancel on the upload options dialog discards the pick without uploading
covers:
  ui:
    - modal:open
    - modal:closed
given:
  - photo: seed/img01.jpg
  - source_file: 'cancel-me.jpg'
    format: jpeg
    width: 64
    height: 64
    id_as: $src_cancel
steps:
  - when:
      - navigate: /timeline
    assert:
      - ui.modal: closed
      - ui.count: .desktop-small-image
        equals: 1

  - when:
      - upload.files:
          trigger: icon/mdi-upload
          files: ['${src_cancel}']
    assert:
      - ui.modal: open
      - ui.text_visible: cancel-me.jpg

  - when:
      - click: button/Cancel
    assert:
      - ui.modal: closed
      - ui.count: .desktop-small-image
        equals: 1
