name: Personal albums isolation between users and admin
covers:
  ui:
    - route:/albums
    - route:/my-albums
    - route:/shares
server:
  bootstrap_admin: false
given:
  - cli_user:
      user_id: admin
      password: e2e_test_pwd
      admin: true
  - cli_user:
      user_id: alice
      password: e2e_test_pwd
  - config:
      fs_notify_watcher: false
  - cli_user:
      user_id: bob
      password: e2e_test_pwd
  - photo: seed.jpg
  - photo: ../users/alice/alice-secret.jpg
    format: jpeg
    width: 16
    height: 16
  - index: '/'

steps:
  # ── alice seeds a personal photo ────────────────────────────────────────
  - when:
      - login:
          user: alice
          password: e2e_test_pwd
    assert:
      - ui.route: /timeline

  # alice's personal photo is seeded under her personal home (see given:)

  # Skip direct assignment UI flow if UI behaves differently; rely on API-level isolation coverage
  # (no UI assertion here; backend tests pin assignment isolation)

  # Timeline toggle behavior: personal photo appears only when opted in.
  - when:
      - navigate: /timeline
    assert:
      - ui.route: /timeline
      - ui.visible: main/

  - when:
      - click.icon: mdi-account-circle
      - click.menu: Settings
    assert:
      - ui.modal: open

  - when:
      - click.testid: frontend-show-filename-chip-switch
    assert:
      - ui.visible: main/

  - when:
      - click.testid: frontend-include-personal-switch
      - click.testid: modal-close
    assert:
      - ui.modal: closed

  - when:
      - navigate: /timeline
    assert:
      - ui.text_visible: alice-secret

  - when:
      - click.icon: mdi-account-circle
      - click.menu: Settings
    assert:
      - ui.modal: open

  - when:
      - click.testid: frontend-include-personal-switch
      - click.testid: modal-close
    assert:
      - ui.modal: closed

  - when:
      - navigate: /timeline
    assert:
      - ui.text_hidden: alice-secret

  # Capture alice's personal album id from URL
  - when:
      - navigate: /my-albums
    assert:
      - ui.route: /my-albums
      - ui.text_visible: Alice

  - when:
      - click.text: Alice
    assert:
      - ui.route: /album/

  - when:
      - capture:
          param: albumId
          id_as: $alice_album
    assert:
      - ui.visible: main/

  - when:
      - navigate: /timeline
      - click.icon: mdi-account-circle
      - click.menu: Log out
    assert:
      - ui.route: /login

  # ── Non-admin attacker (bob) against alice's personal album ─────────────
  - when:
      - login:
          user: bob
          password: e2e_test_pwd
    assert:
      - ui.route: /timeline

  - when:
      - navigate: /my-albums
    assert:
      - ui.route: /my-albums
      - ui.text_visible: Bob
      - ui.text_hidden: Alice
      - ui.text_hidden: Admin

  - when:
      - navigate: /albums
    assert:
      - ui.route: /albums
      - ui.text_hidden: Alice

  # Direct navigation to alice's personal album - must not render alice's items
  - when:
      - navigate: /album/${alice_album}
    assert:
      - ui.route: /album/${alice_album}
      - ui.text_hidden: alice-secret.jpg

  # Bob should not see Alice's album/asset in assignable/share contexts
  - when:
      - navigate: /albums
    assert:
      - ui.route: /albums
      - ui.visible: main/

  - when:
      - navigate: /shares
    assert:
      - ui.route: /shares

  - when:
      - navigate: /timeline
      - click.icon: mdi-account-circle
      - click.menu: Log out
    assert:
      - ui.route: /login

  # ── Admin attacker against plain user's personal album ───────────────────
  - when:
      - login:
          user: admin
          password: e2e_test_pwd
    assert:
      - ui.route: /timeline

  - when:
      - navigate: /my-albums
    assert:
      - ui.route: /my-albums
      - ui.text_visible: Admin
      - ui.text_hidden: Alice

  - when:
      - navigate: /albums
    assert:
      - ui.route: /albums
      - ui.text_hidden: Alice

  # Direct navigation to alice's personal album - admin must not see alice's items
  - when:
      - navigate: /album/${alice_album}
    assert:
      - ui.route: /album/${alice_album}
      - ui.text_hidden: alice-secret.jpg

  - when:
      - navigate: /shares
    assert:
      - ui.route: /shares

  - when:
      - navigate: /timeline
      - click.icon: mdi-account-circle
      - click.menu: Log out
    assert:
      - ui.route: /login
