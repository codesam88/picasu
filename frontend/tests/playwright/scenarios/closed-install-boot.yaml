name: Closed install boots to login
covers:
  api:
    - GET /get/server-info
  ui:
    - route:/login
server:
  bootstrap_admin: false
given:
  - empty: true
steps:
  - when:
      - navigate: /
    assert:
      - ui.route: /login
      # boot signal pins the closed, unenrolled store
      - api.response:
          url: /get/server-info
          status: 200
          json: { enrolled: false, enrollmentOpen: false, captcha: null }
  - when:
      - navigate: /register
    assert:
      - ui.route: /login
  - when:
      - navigate: /login
    assert:
      - ui.route: /login
      # an empty store refuses registration before any gate is consulted
      - api.response:
          url: /post/users/register
          method: POST
          body:
            userId: closed-user
            password: Closed-secret-9
          status: 401 # an empty store refuses registration — there is nothing to enroll against
      # closed install refuses bootstrap even with a valid payload
      - api.response:
          url: /post/users/bootstrap
          method: POST
          body:
            userId: sneaky
            password: Sneaky-secret-9
          status: 401 # no bootstrap window while the flag is off
