# Accepted findings for the tier-1 Schemathesis check.
# Remove an entry when the underlying bug is fixed and the finding disappears.
accepted:
  # bug-snapshot-unknown-500: snapshot-taking ops 500 on unknown snapshot id
  # (edit_flags, edit_rating, edit_tag, set_user_defined_description).
  - method: PUT
    path: /put/edit_flags
    operation: "PUT /put/edit_flags"
    check: not_a_server_error
    failure: ServerError
    bug: bug-snapshot-unknown-500
  - method: PUT
    path: /put/edit_rating
    operation: "PUT /put/edit_rating"
    check: not_a_server_error
    failure: ServerError
    bug: bug-snapshot-unknown-500
  - method: PUT
    path: /put/edit_tag
    operation: "PUT /put/edit_tag"
    check: not_a_server_error
    failure: ServerError
    bug: bug-snapshot-unknown-500
  - method: PUT
    path: /put/set_user_defined_description
    operation: "PUT /put/set_user_defined_description"
    check: not_a_server_error
    failure: ServerError
    bug: bug-snapshot-unknown-500
  # bug-create-dir-album-eexist: create_dir_album 500 on name collision.
  - method: POST
    path: /post/create_dir_album
    operation: "POST /post/create_dir_album"
    check: not_a_server_error
    failure: ServerError
    bug: bug-create-dir-album-eexist
  # bug-spa-fallback-missing-param: missing required query param -> 200 text/html.
  - method: GET
    path: /get/get-data
    operation: "GET /get/get-data"
    check: content_type_conformance
    failure: UndefinedContentType
    bug: bug-spa-fallback-missing-param
  - method: GET
    path: /get/get-rows
    operation: "GET /get/get-rows"
    check: content_type_conformance
    failure: UndefinedContentType
    bug: bug-spa-fallback-missing-param
  - method: GET
    path: /get/get-scroll-bar
    operation: "GET /get/get-scroll-bar"
    check: content_type_conformance
    failure: UndefinedContentType
    bug: bug-spa-fallback-missing-param
  # bug-invite-expiry-overflow: extreme expiresInHours overflows to a 500.
  - method: POST
    path: /post/invites
    operation: "POST /post/invites"
    check: not_a_server_error
    failure: ServerError
    bug: bug-invite-expiry-overflow
