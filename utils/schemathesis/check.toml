# Schemathesis tier-1 check config: bounded single-operation sweep.
base-url = "http://127.0.0.1:8899"
seed = 1
hooks = "utils/schemathesis/hooks_check.py"
headers = { Cookie = "jwt=${PICASU_JWT}" }

[generation]
max-examples = 25
mode = "all"
database = ":memory:"

[cache]
enabled = false

[[operations]]
include-operation-id = "update_admin_config_handler"
enabled = false

[[operations]]
include-operation-id = "reset_auth_key_handler"
enabled = false
