name: Security audit

on:
  push:
    branches: [main]
    paths:
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "**/deny.toml"
      - "frontend/package-lock.json"
      - "frontend/package.json"
  pull_request:
    paths:
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "**/deny.toml"
      - "frontend/package-lock.json"
      - "frontend/package.json"
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # cargo-deny is installed from the pinned prebuilt release: the
      # source build (`cargo install cargo-deny`) took minutes on every run.
      - name: Install cargo-deny
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          just install-cargo-deny
          cargo deny --version
      - run: just audit
