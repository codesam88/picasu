name: Security audit

on:
  push:
    branches: [main]
    paths:
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "**/deny.toml"
      - "frontend/package-lock.json"
      - "frontend/package.json"
  pull_request:
    paths:
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "**/deny.toml"
      - "frontend/package-lock.json"
      - "frontend/package.json"
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@dfae9bf3d6f6c6f20ef4ebb3486c01a51341ff12 # v2.87.18
        with:
          tool: just
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cargo install cargo-deny
      - run: just audit
