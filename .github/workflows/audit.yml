name: Security audit

on:
  push:
    branches: [main]
    paths:
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "**/deny.toml"
      - "frontend/package-lock.json"
      - "frontend/package.json"
  pull_request:
    paths:
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "**/deny.toml"
      - "frontend/package-lock.json"
      - "frontend/package.json"
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read pinned tool versions
        run: echo "JUST_VERSION=$(grep '^JUST_VERSION=' scripts/deps/versions.env | cut -d'"' -f2)" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: just@${{ env.JUST_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # cargo-deny is installed from the pinned prebuilt release: the
      # source build (`cargo install cargo-deny`) took minutes on every run.
      - name: Install cargo-deny
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          just install cargo-deny
          cargo deny --version
      - run: just audit
