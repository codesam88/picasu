name: Workflow lint (zizmor)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - "justfile"
      - "scripts/deps/zizmor.sh"
      - "scripts/deps/versions.env"
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - "justfile"
      - "scripts/deps/zizmor.sh"
      - "scripts/deps/versions.env"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Pinned, offline, deterministic. Blocks pull requests on findings.
  zizmor:
    name: zizmor
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned tool versions
        run: echo "JUST_VERSION=$(grep '^JUST_VERSION=' scripts/deps/versions.env | cut -d'"' -f2)" >> "$GITHUB_ENV"

      - name: Install just
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: just@${{ env.JUST_VERSION }}

      - name: Install uv
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          just install uv
          uv --version

      - name: Offline check
        run: just zizmor-check

  # Scheduled (and manual) only: online audits — stale pins, archived
  # actions — reported to code scanning. SARIF findings do not fail the
  # job; they appear under Security and flag drift without blocking PRs.
  zizmor-scheduled:
    name: zizmor (scheduled)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned tool versions
        run: echo "JUST_VERSION=$(grep '^JUST_VERSION=' scripts/deps/versions.env | cut -d'"' -f2)" >> "$GITHUB_ENV"

      - name: Install just
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: just@${{ env.JUST_VERSION }}

      - name: Install uv
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          just install uv
          uv --version

      # The installer prints status to stdout, so it runs silenced and the
      # pin is read from scripts/deps/versions.env: results.sarif must
      # contain only SARIF.
      - name: Online check (SARIF)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          just install zizmor > /dev/null
          uvx zizmor@"$(grep '^ZIZMOR_VERSION=' scripts/deps/versions.env | cut -d'"' -f2)" --format=sarif -q --no-progress . > results.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
          category: zizmor
