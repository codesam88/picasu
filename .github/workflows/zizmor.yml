name: Workflow lint (zizmor)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - "justfile"
      - "scripts/install-zizmor.sh"
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - "justfile"
      - "scripts/install-zizmor.sh"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install just
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just

      - name: Install uv
        env:
          UV_VERSION: "0.12.18"
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Pinned, offline, deterministic: the same gate as `just zizmor-check`.
      - name: Offline check
        run: just zizmor-check

      # Scheduled (and manual) only: online audits — stale pins, archived
      # actions — that need the GitHub API. Flags drift over time; it does
      # not block pull requests.
      - name: Online check
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: just zizmor-check-online
