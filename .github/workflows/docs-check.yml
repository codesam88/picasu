name: Docs check

on:
  push:
    branches: [main]
    paths:
      - "*.md"
      - "docs/**"
      - ".plan/**"
      - "utils/quint/**/*.md"
  pull_request:
    paths:
      - "*.md"
      - "docs/**"
      - ".plan/**"
      - "utils/quint/**/*.md"

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read pinned tool versions
        run: echo "JUST_VERSION=$(grep '^JUST_VERSION=' scripts/deps/versions.env | cut -d'"' -f2)" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@${{ env.JUST_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm ci
        working-directory: frontend
      - name: Install plan
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          just install plan
          plan --version
      - run: just docs-check
      - run: just gates-test
