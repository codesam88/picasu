name: Build and Push Picasu Docker Images (Multi-arch)

on:
  push:
    tags:
      # Change here: Listen to tags starting with a number (e.g. 0.20.1)
      # Or simply write - '*' to trigger on all tags
      - "[0-9]*"
    paths-ignore:
      - "**/README*"
      - "**/readme*"
      - "docs/**"

env:
  REGISTRY: docker.io
  IMAGE_NAME: picasu/picasu

permissions:
  contents: read

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Calculate Tag variable (version without v)
      - name: Calculate Tag
        id: tag_calc
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # This command converts 'refs/tags/0.20.1' to '0.20.1'
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
            echo "IS_RELEASE=true" >> $GITHUB_ENV
          else
            echo "TAG_NAME=edge" >> $GITHUB_ENV
            echo "IS_RELEASE=false" >> $GITHUB_ENV
          fi

      - name: Build and Push amd64 Image (Manual)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.TAG_NAME }}-amd64
          build-args: |
            BUILD_TYPE=release
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Calculate Tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            echo "TAG_NAME=edge" >> $GITHUB_ENV
          fi

      - name: Build and Push arm64 Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.TAG_NAME }}-arm64
          build-args: |
            BUILD_TYPE=release
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-manifest:
    runs-on: ubuntu-latest
    needs: [build-amd64, build-arm64]
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Calculate Tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
            echo "IS_RELEASE=true" >> $GITHUB_ENV
          else
            echo "TAG_NAME=edge" >> $GITHUB_ENV
            echo "IS_RELEASE=false" >> $GITHUB_ENV
          fi

      - name: Create and Push Manifest (Versioned/Edge)
        # Create Manifest for main tag (e.g. 0.20.1 or edge)
        run: |
          docker manifest create ${{ env.IMAGE_NAME }}:${{ env.TAG_NAME }} \
            --amend ${{ env.IMAGE_NAME }}:${{ env.TAG_NAME }}-amd64 \
            --amend ${{ env.IMAGE_NAME }}:${{ env.TAG_NAME }}-arm64

          docker manifest push ${{ env.IMAGE_NAME }}:${{ env.TAG_NAME }}

      - name: Create and Push Manifest (Latest)
        # Only update latest when releasing a Tag version
        if: env.IS_RELEASE == 'true'
        run: |
          docker manifest create ${{ env.IMAGE_NAME }}:latest \
            --amend ${{ env.IMAGE_NAME }}:${{ env.TAG_NAME }}-amd64 \
            --amend ${{ env.IMAGE_NAME }}:${{ env.TAG_NAME }}-arm64

          docker manifest push ${{ env.IMAGE_NAME }}:latest
