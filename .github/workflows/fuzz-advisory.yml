name: Fuzz (advisory)

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  security-events: write

jobs:
  fuzz:
    name: Schemathesis fuzz (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install just
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just

      - name: Add Rust
        run: rustup component add clippy rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Cache pinned media tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/opt/ffmpeg-*
            ~/.local/opt/Image-ExifTool-*
          key: media-tools-${{ runner.os }}-${{ hashFiles('justfile') }}

      - name: Install ExifTool
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          just install-exiftool
          exiftool -ver

      - name: Install ffmpeg
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          just install-ffmpeg
          ffmpeg -version

      - name: Install uv
        env:
          UV_VERSION: "0.12.18"
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build frontend assets
        run: just frontend-build

      - name: Fuzz
        run: FUZZ_REPORT_OUT="$GITHUB_WORKSPACE/fuzz-report.json" just fuzz-check

      - name: Convert report to SARIF
        if: always() && hashFiles('fuzz-report.json') != ''
        run: python3 utils/schemathesis/json2sarif.py "$GITHUB_WORKSPACE/fuzz-report.json" utils/schemathesis/baseline.yaml "$GITHUB_WORKSPACE/fuzz-report.sarif"

      - name: Upload SARIF
        if: always() && hashFiles('fuzz-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ github.workspace }}/fuzz-report.sarif
          category: schemathesis

      - name: Upload raw report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-report
          path: ${{ github.workspace }}/fuzz-report.json
          if-no-files-found: ignore
