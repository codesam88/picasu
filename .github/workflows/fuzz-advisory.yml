name: Fuzz (advisory)

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  fuzz:
    name: Schemathesis fuzz (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned tool versions
        run: echo "JUST_VERSION=$(grep '^JUST_VERSION=' scripts/deps/versions.env | cut -d'"' -f2)" >> "$GITHUB_ENV"

      - name: Install just
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: just@${{ env.JUST_VERSION }}

      - name: Add Rust
        run: rustup component add clippy rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Cache pinned media tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/opt/ffmpeg-*
            ~/.local/opt/Image-ExifTool-*
          key: media-tools-${{ runner.os }}-${{ hashFiles('scripts/deps/versions.env') }}

      - name: Install ExifTool
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          just install exiftool
          exiftool -ver

      - name: Install ffmpeg
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          just install ffmpeg
          ffmpeg -version

      - name: Install uv
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          just install uv
          uv --version

      - name: Build frontend assets
        run: just frontend-build

      - name: Fuzz
        run: FUZZ_REPORT_OUT="$GITHUB_WORKSPACE/fuzz-report.json" just fuzz-check

      - name: Convert report to SARIF
        if: always() && hashFiles('fuzz-report.json') != ''
        run: python3 utils/fuzz/json2sarif.py "$GITHUB_WORKSPACE/fuzz-report.json" utils/fuzz/baseline.yaml "$GITHUB_WORKSPACE/fuzz-report.sarif"

      - name: Upload SARIF
        if: always() && hashFiles('fuzz-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: ${{ github.workspace }}/fuzz-report.sarif
          category: schemathesis

      - name: Upload raw report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-report
          path: ${{ github.workspace }}/fuzz-report.json
          if-no-files-found: ignore

  stateful:
    name: Schemathesis stateful campaign (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    env:
      FUZZ_MIN: "30"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned tool versions
        run: echo "JUST_VERSION=$(grep '^JUST_VERSION=' scripts/deps/versions.env | cut -d'"' -f2)" >> "$GITHUB_ENV"

      - name: Install just
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: just@${{ env.JUST_VERSION }}

      - name: Add Rust
        run: rustup component add clippy rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Cache pinned media tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/opt/ffmpeg-*
            ~/.local/opt/Image-ExifTool-*
          key: media-tools-${{ runner.os }}-${{ hashFiles('scripts/deps/versions.env') }}

      - name: Install ExifTool
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          just install exiftool
          exiftool -ver

      - name: Install ffmpeg
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          just install ffmpeg
          ffmpeg -version

      - name: Install uv
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          just install uv
          uv --version

      - name: Build frontend assets
        run: just frontend-build

      # Seeds sandbox/fuzz on first use, then runs the stateful phases for
      # FUZZ_MIN minutes. The harness baseline-compares out/report.json, so a
      # new finding fails the step; the job stays advisory.
      - name: Stateful campaign
        run: just fuzz run

      - name: Convert campaign report to SARIF
        if: always() && hashFiles('utils/fuzz/out/report.json') != ''
        run: python3 utils/fuzz/json2sarif.py utils/fuzz/out/report.json utils/fuzz/baseline.yaml "$GITHUB_WORKSPACE/fuzz-stateful.sarif"

      - name: Upload SARIF
        if: always() && hashFiles('fuzz-stateful.sarif') != ''
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: ${{ github.workspace }}/fuzz-stateful.sarif
          category: schemathesis-stateful

      - name: Upload campaign report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-stateful-report
          path: utils/fuzz/out/report.json
          if-no-files-found: ignore

  roles:
    name: Schemathesis per-role differential (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned tool versions
        run: echo "JUST_VERSION=$(grep '^JUST_VERSION=' scripts/deps/versions.env | cut -d'"' -f2)" >> "$GITHUB_ENV"

      - name: Install just
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: just@${{ env.JUST_VERSION }}

      - name: Add Rust
        run: rustup component add clippy rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Cache pinned media tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/opt/ffmpeg-*
            ~/.local/opt/Image-ExifTool-*
          key: media-tools-${{ runner.os }}-${{ hashFiles('scripts/deps/versions.env') }}

      - name: Install ExifTool
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          just install exiftool
          exiftool -ver

      - name: Install ffmpeg
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          just install ffmpeg
          ffmpeg -version

      - name: Install uv
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          just install uv
          uv --version

      - name: Build frontend assets
        run: just frontend-build

      # Equal full budget per role: MAX_EXAMPLES=25, DEADLINE=120s.
      - name: Per-role passes
        run: just fuzz roles --level full

      # Fails on new cross-role diffs only; baseline-roles.json holds triaged
      # diffs. Advisory at job level.
      - name: Differential diff
        if: always() && hashFiles('utils/fuzz/out/report-*.json') != ''
        run: just fuzz diff

      - name: Upload per-role reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-roles-report
          path: |
            utils/fuzz/out/report-*.json
            utils/fuzz/out/role-*.log
          if-no-files-found: ignore
