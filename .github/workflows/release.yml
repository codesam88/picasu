name: Build and Release

on:
  push:
    tags:
      - "[0-9]*"
    branches:
      - "test"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux Binary
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      - name: Build Rust Backend
        working-directory: ./backend
        run: cargo build --release --features "embed-frontend auto-open-browser"

      # The route-set gate, run on the binary that is about to ship: every route
      # this build mounts must be in the committed spec, and an operation the
      # document carries that nothing mounts is drift unless it is feature-gated
      # and the feature is off here.
      - name: Check the shipped binary's routes against the committed spec
        run: ./backend/target/release/picasu --check-openapi backend/openapi.json

      # The production-level test run: the same suite, in the optimized build
      # that is about to ship. It runs here and only here — a release is the
      # moment the optimized build has to earn its keep, and the pull-request
      # path does not pay for a release-profile compile of everything.
      - name: Install cargo-nextest
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          just install-nextest
          cargo nextest --version

      # The video pipeline spawns ffprobe and ffmpeg; the runner image ships
      # neither. (The packaged release carries its own static build.)
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffprobe -version

      - name: Install Playwright browsers
        run: npx playwright install chromium
        working-directory: ./frontend

      # The scenarios generate their fixture images through snapfab, which
      # spawns ExifTool to write the metadata.
      - name: Install ExifTool
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          just install-exiftool
          exiftool -ver

      - name: Test the release build
        run: |
          just backend-test-release
          PICASU_BINARY=target/release/picasu just frontend-playwright

      - name: Prepare Release Package
        run: |
          echo "Downloading FFmpeg static build..."
          wget -q https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz

          tar -xf ffmpeg-release-amd64-static.tar.xz

          mkdir -p final_package/picasu-linux/bin

          cp backend/target/release/picasu final_package/picasu-linux/

          cp ffmpeg-*-amd64-static/ffmpeg final_package/picasu-linux/bin/
          cp ffmpeg-*-amd64-static/ffprobe final_package/picasu-linux/bin/

          chmod +x final_package/picasu-linux/picasu
          chmod +x final_package/picasu-linux/bin/ffmpeg
          chmod +x final_package/picasu-linux/bin/ffprobe

          ./final_package/picasu-linux/bin/ffmpeg -version | head -n 1

      - name: Create Tarball
        run: |
          cd final_package

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="0.0.0"
          fi

          echo "Detected version: $VERSION"

          TAR_NAME="picasu-linux-$VERSION.tar.gz"

          tar -czf "../$TAR_NAME" picasu-linux

          echo "ASSET_PATH=$TAR_NAME" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: picasu-linux-package
          path: ${{ env.ASSET_PATH }}

      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.ASSET_PATH }}
