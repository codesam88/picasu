# The static analysis, over the whole tree.
#
# It does not run on pull requests: it is the slowest check by far, and it
# has never produced a finding that was not a false positive. It runs when a
# change is merged into main, and as the release gate — the release workflow
# calls this one, so the analysis has a single definition.
#
# The Rust analysis covers the backend crate and the workspace's other
# members; the JavaScript and TypeScript jobs cover the frontend.
name: "CodeQL"

on:
  push:
    branches: ["main"]
  # The release workflow calls this as its analysis gate.
  workflow_call:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["javascript", "typescript", "rust"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        if: matrix.language != 'rust'
        uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

      - name: Build the Rust workspace
        if: matrix.language == 'rust'
        run: cargo build --workspace --locked

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{matrix.language}}"
