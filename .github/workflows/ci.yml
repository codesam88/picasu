name: Run checks and tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - ".plan/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/copilot-instructions.md"
  pull_request:
    paths-ignore:
      - "*.md"
      - "docs/**"
      - ".plan/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/copilot-instructions.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  checks-n-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install just
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: just

      - name: Add Rust
        run: rustup component add clippy rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install plan tool
        run: just install-plan

      # Image metadata is read with ExifTool, an external binary with no
      # in-process fallback. Install the pinned distribution the dev
      # environment uses (`just install-exiftool`, no root, pure Perl): the
      # tests encode the pinned version's refusal behaviour, which the distro
      # package does not reproduce.
      - name: Install ExifTool
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          just install-exiftool
          exiftool -ver

      # Video metadata (ffprobe), stream dimensions (ffprobe) and thumbnails
      # (ffmpeg) are external binaries too. The runner image ships neither, and
      # without them the video pipeline tests and every video scenario fail.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffprobe -version

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            playwright-

      - name: Install Playwright browsers
        run: npx playwright install chromium
        working-directory: frontend

      - name: Check (format + lints)
        run: just check

      - name: Test
        run: just test

  test-release-build:
    if: github.event_name != 'pull_request'
    needs: [checks-n-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install just
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: just

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            playwright-

      - name: Install Playwright browsers
        run: npx playwright install chromium
        working-directory: frontend

      # Same requirements as the checks job: the release build runs the same
      # test suite, so the pinned ExifTool and ffmpeg have to be on PATH here
      # too.
      - name: Install ExifTool
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          just install-exiftool
          exiftool -ver

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffprobe -version

      - name: Build and test release
        run: just test-release
