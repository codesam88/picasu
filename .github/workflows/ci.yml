name: Run checks and tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - ".plan/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/copilot-instructions.md"
  pull_request:
    paths-ignore:
      - "*.md"
      - "docs/**"
      - ".plan/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/copilot-instructions.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # The backend job owns the cargo work: the format and lint gates, the test
  # suite, the utils crates and the API contract check. The frontend job
  # owns the node work. They run in parallel, so the wall clock is the
  # slower of the two instead of their sum.
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install just
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just

      - name: Add Rust
        run: rustup component add clippy rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # The contract check builds the backend with the embed-frontend
      # feature, and that build embeds the built assets — so this job needs
      # node and the frontend build, not only cargo.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # The backend suite runs under cargo-nextest (one process per test, so
      # it runs in parallel instead of serializing on the shared test data
      # home). The prebuilt binary is installed from the pinned release, not
      # compiled from source — `cargo install cargo-nextest` takes minutes.
      - name: Install cargo-nextest
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          just install-nextest
          cargo nextest --version

      # The pinned media tools unpack into ~/.local/opt; the install
      # scripts recreate the ~/.local/bin symlinks cheaply every run, so
      # caching the unpacked dirs turns both installs below into a
      # relink-only no-op — no 40MB+ downloads on every push. Keyed on
      # justfile (home of the version+digest pins); exact key, no
      # restore-keys, so a stale build can never satisfy a new pin. A
      # miss downloads and verifies exactly as before.
      - name: Cache pinned media tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/opt/ffmpeg-*
            ~/.local/opt/Image-ExifTool-*
          key: media-tools-${{ runner.os }}-${{ hashFiles('justfile') }}

      # snapfab writes fixture metadata through ExifTool, an external binary
      # the backend itself never spawns (the backend reads metadata in-process).
      # Install the pinned distribution the dev environment uses
      # (`just install-exiftool`, no root, pure Perl): the snapfab tests spawn
      # it, and they encode the pinned version's refusal behaviour, which the
      # distro package does not reproduce.
      - name: Install ExifTool
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          just install-exiftool
          exiftool -ver

      # Video metadata (ffprobe) and video thumbnails (ffmpeg) are external
      # binaries the backend spawns with no in-process fallback. The pinned
      # static build is the one the release package ships, so the tests run
      # against the ffmpeg that reaches the admin's machine.
      - name: Install ffmpeg
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          just install-ffmpeg
          ffmpeg -version

      - name: Install uv
        env:
          UV_VERSION: "0.12.18"
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build the frontend assets
        run: just frontend-build

      - name: Check (backend, utils, API contract, env vars)
        run: |
          just backend-check
          just utils-check
          just openapi-check
          just env-var-check

      - name: Test (backend, utils)
        run: |
          just backend-test
          just utils-test

      # The API validation gate: a bounded single-operation sweep judged
      # against the accepted-findings baseline. A new finding fails the job;
      # the stateful campaign stays advisory because its phases are
      # time-budgeted and need a served instance.
      - name: API validation (Schemathesis tier 1)
        run: just fuzz-check

      # The fuzz matrix: matrix-derived auth checks executed deterministically
      # against a throwaway seeded instance — cross-scope, wrong-credential, renewal
      # binding and demoted token. The check list is rebuilt from the auth
      # matrix on every run, so it cannot drift from the contract.
      - name: Fuzz matrix (auth-model checks)
        run: just fuzz-matrix

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install just
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just

      # The end-to-end suite runs against a real backend, so this job builds
      # one. It runs in parallel with the backend job instead of waiting for
      # it: the compile overlaps the backend's own work rather than
      # following it.
      - name: Add Rust
        run: rustup component add clippy rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            playwright-

      - name: Install Playwright browsers
        run: npx playwright install chromium
        working-directory: frontend

      # Same media-tools cache as the backend job: the unpacked dirs keyed
      # on justfile; the install scripts relink the bin entries.
      - name: Cache pinned media tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/opt/ffmpeg-*
            ~/.local/opt/Image-ExifTool-*
          key: media-tools-${{ runner.os }}-${{ hashFiles('justfile') }}

      # The video pipeline spawns ffprobe and ffmpeg. The pinned static build
      # is the one the release package ships.
      - name: Install ffmpeg
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          just install-ffmpeg
          ffmpeg -version

      # The scenarios generate their fixture images through snapfab, which
      # spawns ExifTool to write the metadata (the backend reads metadata
      # in-process and never spawns it). Without it the fixtures come out
      # empty and the scenarios fail on missing media.
      - name: Install ExifTool
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          just install-exiftool
          exiftool -ver

      # The docs gates ride along with the frontend job: they need the same
      # node_modules (prettier) and take seconds.
      - name: Check (frontend, docs)
        run: |
          just frontend-check
          just docs-check
          just plan-lint

      - name: Test (frontend)
        run: |
          just frontend-vitest
          just frontend-playwright

  dylint:
    name: Dylint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install just
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just

      - name: Add Rust (stable)
        run: rustup component add clippy rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # The lint crates pin nightly-2026-08-01 and need rustc-dev + llvm-tools;
      # the main build stays on stable. Installed alongside, not instead of,
      # stable so `just install-dylint` (a `cargo install`) keeps working.
      - name: Install nightly toolchain + components
        run: rustup toolchain install nightly-2026-08-01 --component rustc-dev,llvm-tools

      - name: Install cargo-dylint
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          just install-dylint
          cargo dylint --version

      - name: Dylint check (zero-tolerance)
        env:
          DYLINT_RUSTFLAGS: "-D warnings"
        run: just dylint-check

      # The blessed UI fixtures are the lints' own regression suite; the
      # zero-tolerance check above runs the lints over the backend, this step
      # proves the lints still behave as their fixtures say.
      - name: Dylint UI suites
        run: |
          for crate in auth2_guard_propagation auth3_no_forward_denial credentials_agreement decode_agreement; do
            echo "::group::$crate"
            (cd "utils/dylint-lints/$crate" && cargo test)
            echo "::endgroup::"
          done
