[package]
name = "picasu"
version = "0.1.0"
edition = "2024"
license = "MIT"
default-run = "picasu"

[lib]
name = "picasu"
path = "src/lib.rs"

[[bin]]
name = "picasu"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.102"
arrayvec = { version = "0.7.6", features = ["serde"] }
bitcode = { version = "0.6.9", features = ["arrayvec"] }
blake3 = "1.8.5"
chrono = "0.4.44"
crossbeam-queue = "0.3.12"
dashmap = { version = "6.1.0", features = ["rayon"] }
env_logger = { version = "0.11.10", features = ["humantime", "color"] }
envy = "0.4.2"
filetime = "0.2.29"
futures = "0.3.32"
figment = { version = "0.10", features = ["json", "toml"] }
image = "0.25.10"
image_hasher = "3.1.1"
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["aws_lc_rs"] }
kamadak-exif = "0.6.1"
log = { version = "0.4.29", features = ["kv"] }
mini_executor = "2.0.3"
notify = "8.2.0"
path-clean = "1.0.1"
rand = "0.10.1"
rayon = "1.12.0"
redb = "4.1"
regex = "1.12.3"
ureq = { version = "3", features = ["json"] }
rocket = { version = "0.5.1", features = ["json"] }
rocket_seek_stream = "0.2.6"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.149"
thumbhash = "0.1.0"
tokio = { version = "1.52.3", features = ["full"] }
tokio-rayon = "2.1.0"
toml = "1.1"
unicode-width = "0.2.2"
uuid = { version = "1.23.1", features = ["v4"] }
walkdir = "2.5.0"
base64 = "0.23.1"
directories = "6.0.0"
webbrowser = { version = "1.2.1", optional = true }
rust-embed = "8.11.0"
mime_guess = "2.0.5"
utoipa = "5"
unicode-normalization = "0.1.25"
infer = "0.22.0"

[dev-dependencies]
tempfile = "3"
serde_yaml = "0.9"
snapfab = { version = "0.1", path = "../utils/snapfab" }
# `build/ast_scan.rs` is shared with `src/tests/ast_scan.rs` via `#[path]`, so
# the test target needs the same parser crates the build script uses.
# `span-locations` gives `Span::start()` line/column accuracy outside a
# proc-macro context — `build/reachability.rs` (also included via `#[path]`,
# by `src/tests/reachability.rs`) reports sink findings by file:line, so the
# registry and the gate can point at the exact site. The build script itself
# does not include that module (see the comment in `build.rs`).
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "parsing", "extra-traits", "visit"] }

# `build/ast_scan.rs` parses router sources with syn; syn 2 and proc-macro2
# are already in the lock file via rocket_codegen and utoipa-gen.
[build-dependencies]
proc-macro2 = "1"
syn = { version = "2", features = ["full", "parsing", "extra-traits", "visit"] }

[features]
embed-frontend = []
auto-open-browser = ["dep:webbrowser"]

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# unwrap_used is set to warn so IDEs surface call sites; precommit allows it
# via -A to avoid blocking on the ~140 existing call sites until they are addressed
unwrap_used = { level = "warn", priority = 0 }
