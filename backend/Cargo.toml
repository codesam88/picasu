[package]
name = "picasu"
version = "0.1.0"
edition = "2024"
license = "MIT"
default-run = "picasu"

[lib]
name = "picasu"
path = "src/lib.rs"

[[bin]]
name = "picasu"
path = "src/main.rs"

[[bin]]
name = "picasu-cmd"
path = "src/bin/picasu-cmd.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.102"
arrayvec = { version = "0.7.6", features = ["serde"] }
bitcode = { version = "0.6.9", features = ["arrayvec"] }
blake3 = "1.8.5"
chrono = "0.4.44"
cookie = "0.18"
clap = { version = "4", features = ["derive"] }
crossbeam-queue = "0.3.12"
dashmap = { version = "6.1.0", features = ["rayon"] }
env_logger = { version = "0.11.10", features = ["humantime", "color"] }
envy = "0.4.2"
filetime = "0.2.29"
futures = "0.3.32"
figment = { version = "0.10", features = ["json", "toml"] }
image = { version = "0.25.10", default-features = false, features = [
  "jpeg",
  "png",
  "gif",
  "webp",
  "tiff",
  "bmp",
  "rayon",
] }
image_hasher = "3.1.1"
# HS256 only (the tokens are HMAC-signed), so the pure-Rust crypto backend
# is enough: the aws-lc (BoringSSL) backend compiles megabytes of code the
# app never calls.
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["aws_lc_rs"] }
kamadak-exif = "0.6.1"
log = { version = "0.4.29", features = ["kv"] }
mini_executor = "2.0.3"
notify = "8.2.0"
path-clean = "1.0.1"
rand = "0.10.1"
rayon = "1.12.0"
redb = "4.1"
libc = "0.2"
regex = "1.12.3"
rpassword = "7"
rocket = { version = "0.5.1", features = ["json"] }
rocket_seek_stream = "0.2.6"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.149"
thumbhash = "0.1.0"
tokio = { version = "1.52.3", features = ["full"] }
tokio-rayon = "2.1.0"
toml = "1.1"
unicode-width = "0.2.2"
uuid = { version = "1.23.1", features = ["v4"] }
walkdir = "2.5.0"
base64 = "0.23.1"
directories = "6.0.0"
webbrowser = { version = "1.2.1", optional = true }
rust-embed = "8.11.0"
mime_guess = "2.0.5"
utoipa = { version = "6", features = ["rocket_extras"] }
utoipauto = "0.3.1"
unicode-normalization = "0.1.25"
xmpkit = { version = "0.1.6", default-features = false, features = [
  "jpeg",
  "png",
  "tiff",
  "webp",
  "mpeg4",
  "mutli-thread",
] }
infer = "0.22.0"
pbkdf2 = "0.13.0"
sha2 = "0.11.0"
subtle = "2.6.1"
argon2 = "0.6.0"

[dev-dependencies]
tempfile = "3"
serde-saphyr = "2.0"
# Validates tests/scenarios/**.yaml against tests/schema.json. `default-features`
# is off on purpose: the schema only ever uses local `#/definitions/…` JSON
# pointers, so the crate's remote/file resolvers (and the reqwest + rustls they
# pull in) would be dead weight in a dev-dependency.
jsonschema = { version = "0.60", default-features = false }
snapfab = { version = "0.1", path = "../utils/snapfab" }
openapi-sanity = { version = "0.1", path = "../utils/openapi-sanity" }
proptest = "1.11.0"

[features]
embed-frontend = []
auto-open-browser = ["dep:webbrowser"]

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# unwrap_used is warn so IDEs surface call sites; precommit/CI escalate via
# -D warnings over --all-targets, which gates test code too.
unwrap_used = { level = "warn", priority = 0 }
