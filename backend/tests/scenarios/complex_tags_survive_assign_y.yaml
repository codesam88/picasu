name: complex tags and album survive assign
# Full lifecycle: photo with embedded XMP tags + EXIF date imported from
# filesystem -> scan -> assigned to album -> verify tags and album visible
# via API and file physically moved on disk. Album membership is asserted on
# the detail record alongside the tags (the top-level `then` can only target
# the last response — the detail one, which carries both).
given:
  - dir_album: /e2e_y/album
    id_as: $album
  - photo: /e2e_y/import/sunset.jpg
    tags:
      - e2e_y_scenic
      - e2e_y_sunset
      - golden hour
    exif_date: "2025:06:15 19:30:00"
    id_as: $photo
    asset_id_as: $asset_id
when:
  # Step 1: Assign photo to album
  - call: PUT /put/assign_album
    body:
      assetId: "${asset_id}"
      albumId: "${album}"
      onConflict: "rename"
      alias: "${data_path}/e2e_y/import/sunset.jpg"
    then:
      - response.status: 200
  # Step 2: Verify tags and album membership via the metadata detail read.
  - call: POST /get/prefetch?locate=${asset_id}
    capture:
      token: response.token
      ts: response.prefetch.timestamp
  - call: GET /get/metadata/${asset_id}?timestamp=${ts}
    auth: false
    headers:
      Authorization: "Bearer ${token}"
then:
  - response.status: 200
  - response.json.album: "${album}"
  - response.json.tags:
      contains: e2e_y_scenic
  - response.json.tags:
      contains: e2e_y_sunset
  - response.json.tags:
      contains: golden hour
  # File moved on disk and original removed
  - file_exists: /e2e_y/album/sunset.jpg
  - file_absent: /e2e_y/import/sunset.jpg
