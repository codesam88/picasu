name: assign_album on_conflict=rename same hash under a different name creates separate assets
# In the path-primary model, same-hash files are independent assets.
# Moving one file does not affect the other, even when they share content hash.
given:
  - dir_album: /e2e_rsdn/album
    id_as: $album
  - photo: /e2e_rsdn/src/other.jpg
    id_as: $src
when:
  # Upload the byte-identical source into the album under a different name.
  - upload:
      file: /e2e_rsdn/src/other.jpg
      filename: photo.jpg
      target_album: "${album}"
      on_conflict: rename
    then:
      - response.status: 200
  - call: POST /post/index/album
    raw_body: '{"album": "/e2e_rsdn"}'
    then:
      - response.status: 202
  - wait_index: true
  # Move source into the album.
  - call: PUT /put/assign_album
    body:
      hash: "${src}"
      albumId: "${album}"
      onConflict: "rename"
      alias: "${data_path}/e2e_rsdn/src/other.jpg"
    then:
      - response.status: 200
  # Re-index and check the album has both files.
  - call: POST /post/index/album
    raw_body: '{"album": "/e2e_rsdn"}'
    then:
      - response.status: 202
  - wait_index: true
  - call: POST /get/prefetch
    body: { Album: "${album}" }
then:
  - response.status: 200
  # Album has placeholder + photo.jpeg + other.jpg = 3 items.
  - compare:
      response.json.prefetch.dataLength: { ">=": 2 }
  - file_exists: /e2e_rsdn/album/photo.jpeg
  - file_exists: /e2e_rsdn/album/other.jpg
  - file_absent: /e2e_rsdn/src/other.jpg
