name: deleting an alias whose file no longer exists on disk must not error and must prune the record
# Deleting an alias whose file no longer exists on disk (removed externally,
# not via the API) must not error: remove_alias_file tolerates NotFound and
# the delete prunes the alias from the record. The fs watcher is disabled so
# the stale record survives from the initial scan until the delete, keeping it
# locatable for this scenario.
given:
  - config: {fs_notify_watcher: false}
  - photo: /e2e_miss/photo.jpg
    id_as: $photo
  - remove: /e2e_miss/photo.jpg
when:
  # The stale record is still locatable because nothing re-indexed after removal.
  - call: POST /get/prefetch?locate=${photo}
    capture:
      ts: response.prefetch.timestamp
      idx: response.prefetch.locateTo
  # Deletion succeeds even though the alias file is already gone on disk.
  - call: DELETE /delete/delete-data
    raw_body: '{"deleteList":[${idx}],"aliasList":["e2e_miss/photo.jpg"],"timestamp":${ts}}'
    then:
      - response.status: 200
  # Verify the record was pruned rather than left stale (locateTo null = gone).
  - call: POST /get/prefetch?locate=${photo}
then:
  - response.status: 200
  - response.json.prefetch.locateTo: null
  # Trivially true: the file was removed in the given phase.
  - file_absent: /e2e_miss/photo.jpg