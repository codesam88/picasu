name: deleting an asset whose file no longer exists on disk must not error
# Deleting an asset whose file no longer exists on disk (removed externally,
# not via the API) must not error: remove_file tolerates NotFound and
# the delete removes the asset record. The fs watcher is disabled so
# the stale record survives from the initial scan until the delete, keeping it
# locatable for this scenario.
given:
  - config: {fs_notify_watcher: false}
  - photo: /e2e_miss/photo.jpg
    id_as: $photo
    asset_id_as: $asset_id
  - remove: /e2e_miss/photo.jpg
when:
  # The stale record is still locatable because nothing re-indexed after removal.
  - call: POST /get/prefetch?locate=${asset_id}
    capture:
      ts: response.prefetch.timestamp
  # Deletion succeeds even though the file is already gone on disk.
  - call: DELETE /delete/delete-data
    raw_body: '{"assetIds":["${asset_id}"],"timestamp":${ts}}'
    then:
      - response.status: 200
  # Verify the record was pruned rather than left stale (locateTo null = gone).
  - call: POST /get/prefetch?locate=${asset_id}
then:
  - response.status: 200
  - response.json.prefetch.locateTo: null
  # Trivially true: the file was removed in the given phase.
  - file_absent: /e2e_miss/photo.jpg
