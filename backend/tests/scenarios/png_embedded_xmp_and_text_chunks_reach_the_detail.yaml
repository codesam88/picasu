name: png embedded xmp in a compressed itxt chunk and its text chunks reach the detail
# The claim decision 6 of `.plan/exiftool-metadata-engine.md` overturns: a PNG's
# embedded XMP was "unsupported, no extraction work" and the pin
# `pinned_png_compressed_embedded_xmp_is_not_extracted` said the packet was not
# extracted. It is now claimed and read, and this scenario is the end-to-end
# proof on the checked-in fixture `png-48x32-xmp-text` (provenance and digest in
# `utils/snapfab/capabilities.json`, generated by the script checked in beside
# it). The file carries:
#
#   * an `iTXt` chunk with the keyword `XML:com.adobe.xmp` and its compression
#     flag set, so the packet is deflate-compressed in the file. The retired byte
#     scan decompressed nothing, which is why the pin existed; the engine swap
#     makes the packet readable. The manifest test
#     `the_pinned_png_fixture_carries_a_compressed_itxt_packet_and_text_chunks`
#     pins that the fixture really is compressed and holds no plaintext packet.
#   * `tEXt` chunks: `Description` (a keyword the native mapping reads) and
#     `Comment`/`Source` (keywords it does not).
#
# What each assertion is for:
#
#   tags, description, rating          the native fields of an image the packet
#                                     supplies. With no sidecar and no IIM record
#                                     in a PNG, the packet is the only XMP source
#                                     there is. (`dc:title` is in the packet too,
#                                     and the mapping reads it — `title` is a
#                                     dir-album display override, a field the
#                                     image payload has no slot for, so there is
#                                     nothing to assert on it here.)
#   description is the packet's, not   the precedence rule end-to-end: the file
#   the text chunk's                  also has a `Description` text chunk, and
#                                     XMP outranks PNG text.
#   furtherMetadata.PNG:Comment/Source the text chunks the app does not model.
#                                     `PNG:Source` is a registered PNG text
#                                     keyword; `Comment` is one of the standard
#                                     ten.
#   the XMP keys absent from it        the split: what the mapping consumed is not
#                                     repeated in the read-only bucket.
#   width/height/thumbnail            the file is a decodable image, not just a
#                                     readable metadata carrier.
#
# The negative control is `png_without_xmp_source_has_no_tags` (a PNG with no XMP
# source at all), and the sidecar path is `png_sidecar_xmp_tags`.
given:
  - fixture:
      source: png-48x32-xmp-text
      destination: /e2e_png_xmp_text/photo.png
    id_as: $photo
    asset_id_as: $asset_id
when:
  - call: POST /get/prefetch?locate=${asset_id}
    capture:
      token: response.token
      ts: response.prefetch.timestamp
  - call: GET /get/metadata/${asset_id}?timestamp=${ts}
    auth: false
    headers:
      Authorization: "Bearer ${token}"
then:
  - response.status: 200
  - response.json.ext: png
  # The compressed packet's own values.
  - response.json.tags:
      contains: e2e_png_xmp_alpine
  - response.json.tags:
      contains: e2e_png_xmp_winter
  - response.json.description: "A caption from the compressed packet"
  - response.json.rating: 4
  # The text chunks the app does not model are surfaced read-only, keyed by the
  # group ExifTool filed them in.
  - response.json.furtherMetadata.PNG:Comment: "A text chunk comment"
  - response.json.furtherMetadata.PNG:Source: "picasu test fixtures"
  # The packet's own fields are not repeated there: the mapping consumed them.
  - response.json.furtherMetadata.XMP-dc:Subject: null
  - response.json.furtherMetadata.XMP-dc:Description: null
  - response.json.furtherMetadata.XMP-dc:Title: null
  - response.json.furtherMetadata.XMP-xmp:Rating: null
  # Nor is the text chunk the mapping read from the XMP family: the packet won.
  - response.json.furtherMetadata.PNG:Description: null
  # The file is a real image: the fixture's own 48x32 and a thumbnail on disk.
  - response.json.width: 48
  - response.json.height: 32
  - thumb_exists: $photo
  - file_exists: e2e_png_xmp_text/photo.png
