name: trash album with photos then permanent delete removes all
given:
  - dir_album: /e2e_trash_album
    id_as: $album
  - photo: /e2e_trash_album/photo_a.jpg
    id_as: $photo_a
  - photo: /e2e_trash_album/photo_b.jpg
    id_as: $photo_b
when:
  - call: POST /get/prefetch?locate=${photo_a}
    capture:
      ts: response.prefetch.timestamp
      idx_a: response.prefetch.locateTo
  - call: POST /get/prefetch?locate=${photo_b}
    capture:
      idx_b: response.prefetch.locateTo
  - call: DELETE /delete/delete-data
    raw_body: '{"deleteList":[{"index":${idx_a},"aliasPath":"e2e_trash_album/photo_a.jpg"},{"index":${idx_b},"aliasPath":"e2e_trash_album/photo_b.jpg"}],"timestamp":${ts}}'
    then:
      - response.status: 200
      - file_absent: /e2e_trash_album/photo_a.jpg
      - file_absent: /e2e_trash_album/photo_b.jpg
      - file_exists: /.trash/e2e_trash_album/photo_a.jpg
      - file_exists: /.trash/e2e_trash_album/photo_b.jpg
  - call: POST /get/prefetch?locate=${photo_a}
    capture:
      ts2: response.prefetch.timestamp
      idx_a2: response.prefetch.locateTo
  - call: POST /get/prefetch?locate=${photo_b}
    capture:
      idx_b2: response.prefetch.locateTo
  - call: DELETE /delete/delete-data
    raw_body: '{"deleteList":[{"index":${idx_a2},"aliasPath":"e2e_trash_album/photo_a.jpg"},{"index":${idx_b2},"aliasPath":"e2e_trash_album/photo_b.jpg"}],"timestamp":${ts2}}'
then:
  - response.status: 200
  - file_absent: /.trash/e2e_trash_album/photo_a.jpg
  - file_absent: /.trash/e2e_trash_album/photo_b.jpg
