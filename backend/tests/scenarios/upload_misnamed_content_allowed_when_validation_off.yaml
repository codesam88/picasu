name: Upload declaring image/jpeg but containing PNG bytes is accepted when content validation is off
# A mislabeled file is the one case validate_upload_content governs: the content
# is identified, it simply disagrees with the extension-derived type, and
# disabling the setting tolerates that.
given:
  - dir_album: /e2e_up_spoof_off/target
    id_as: $album
  - photo: /e2e_up_spoof_off/src/photo.png
    format: png
  - config:
      validate_upload_content: false
when:
  - upload:
      file: /e2e_up_spoof_off/src/photo.png
      filename: photo.jpg
      target_album: "${album}"
      content_type: image/jpeg
then:
  - response.status: 200
