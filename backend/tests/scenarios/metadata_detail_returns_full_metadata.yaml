name: metadata detail endpoint returns full metadata for an asset
# Phase 14 detail read path: list rows no longer carry tags/EXIF/description,
# so a detail fetch by asset_id must return the full METADATA_TABLE record
# (tags + EXIF as stored) for the sidebar / metadata views.
given:
  - photo: /e2e_meta2/photo.jpg
    tags:
      - e2e_meta2_tag
    exif_date: "2025:03:02 12:00:00"
    id_as: $photo
    asset_id_as: $asset_id
when:
  - call: POST /get/prefetch?locate=${asset_id}
    capture:
      token: response.token
      ts: response.prefetch.timestamp
  - call: GET /get/metadata/${asset_id}?timestamp=${ts}
    auth: false
    headers:
      Authorization: "Bearer ${token}"
then:
  - response.status: 200
  - response.json.tags:
      contains: e2e_meta2_tag
  - response.json.exifVec.DateTimeOriginal: not_null
  - file_exists: e2e_meta2/photo.jpg
