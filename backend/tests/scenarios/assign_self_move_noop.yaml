name: assign_album moving a file into the album it already lives in is a 200 no-op
# Self-move under both surviving modes: the selected file is already inside the
# target album dir. rename and skip must both return 200 with no physical
# change — file at the same path, single alias, no photo-001.
given:
  - dir_album: /e2e_self/a
    id_as: $album
  - photo: /e2e_self/a/photo.jpg
    id_as: $p
    asset_id_as: $p_asset
when:
  - call: PUT /put/assign_album
    body:
      assetId: "${p_asset}"
      albumId: "${album}"
      onConflict: "rename"
    then:
      - response.status: 200
  - call: PUT /put/assign_album
    body:
      assetId: "${p_asset}"
      albumId: "${album}"
      onConflict: "skip"
    then:
      - response.status: 200
  - call: GET /get/test/record/${p_asset}
then:
  - response.status: 200
  - response.json.aliases.[0].file: "${data_path}/e2e_self/a/photo.jpg"
  - file_exists: /e2e_self/a/photo.jpg
  - file_absent: /e2e_self/a/photo-001.jpg
