name: rebuild populates asset tables and serves get-data
# A filesystem rebuild must produce asset-table state that the HTTP API can
# serve: discover the photo's asset_id by path, then prefetch/get-data must
# return that asset. Exercises POST /post/rebuild as the production caller
# of rebuild_from_filesystem (METADATA_TABLE sync + in-memory tree refresh).
given:
  - dir_album: /e2e_rebuild
  - photo: /e2e_rebuild/photo.jpg

when:
  # Rebuild from the filesystem (routes to rebuild_from_filesystem).
  - call: POST /post/rebuild
    then:
      - response.status: 200
    asset_id_as: $asset_id
    discover_path: e2e_rebuild/photo.jpg
  # Prefetch the rebuilt photo by its newly assigned asset_id.
  - call: POST /get/prefetch?locate=${asset_id}
    capture:
      ts: response.prefetch.timestamp
      idx: response.prefetch.locateTo
      token: response.token
    calc:
      end: "${idx}+1"
  - call: GET /get/get-data?timestamp=${ts}&start=${idx}&end=${end}
    auth: false
    headers:
      Authorization: "Bearer ${token}"
then:
  - response.status: 200
  - response.json.[0].assetId: "${asset_id}"
  - file_exists: e2e_rebuild/photo.jpg
