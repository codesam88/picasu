name: valid hash token serves original file by asset_id
# A ClaimsHash token whose asset_id matches the URL path must be accepted
# by GuardHashOriginal for the original file endpoint.
given:
  - dir_album: /e2e_orig/album
    id_as: $album
  - photo: /e2e_orig/album/photo.jpg
    id_as: $photo
    asset_id_as: $asset_id
when:
  - call: POST /post/index/album
    raw_body: '{"album": "/e2e_orig"}'
    then:
      - response.status: 202
  - wait_index: true
  # Fetch data to get the hash token (with allow_original=true).
  - call: POST /get/prefetch?locate=${asset_id}
    capture:
      ts: response.prefetch.timestamp
      idx: response.prefetch.locateTo
      token: response.token
    calc:
      end: "${idx}+1"
  - call: GET /get/get-data?timestamp=${ts}&start=${idx}&end=${end}
    auth: false
    headers:
      Authorization: "Bearer ${token}"
    capture:
      hash_token: response.[0].token
      ext: response.[0].abstractData.ext
    then:
      - response.status: 200
  # Use the hash token to fetch the original file by asset_id.
  - call: "GET /object/imported/${asset_id:0:2}/${asset_id}.${ext}"
    auth: false
    headers:
      Authorization: "Bearer ${hash_token}"
then:
  - response.status: 200
