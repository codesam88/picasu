name: trash one alias of photo with multiple aliases
given:
  - dir_album: /e2e_trash_ma/album
    id_as: $album
  - photo: /e2e_trash_ma/original.jpg
    id_as: $photo
when:
  - call: POST /get/prefetch?locate=${photo}
    capture:
      ts: response.prefetch.timestamp
      idx: response.prefetch.locateTo
  - call: PUT /put/assign_album
    body:
      hash: "${photo}"
      albumId: "${album}"
    then:
      - response.status: 200
      - file_exists: /e2e_trash_ma/album/original.jpg
  - call: POST /get/prefetch?locate=${photo}
    capture:
      ts2: response.prefetch.timestamp
      idx2: response.prefetch.locateTo
  - call: DELETE /delete/delete-data
    raw_body: '{"deleteList":[{"index":${idx2},"aliasPath":"e2e_trash_ma/album/original.jpg"}],"timestamp":${ts2}}'
then:
  - response.status: 200
  - file_absent: /e2e_trash_ma/original.jpg
  - file_absent: /e2e_trash_ma/album/original.jpg
  - file_exists: /.trash/e2e_trash_ma/album/original.jpg
