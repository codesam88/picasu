name: delete by asset_id removes file and sidecar
# Path-primary contract: delete endpoint accepts asset_ids, not indices.
given:
  - photo: /e2e_aid_del/photo.jpg
    id_as: $photo
    asset_id_as: $asset_id
when:
  - call: POST /get/prefetch?locate=${asset_id}
    capture:
      ts: response.prefetch.timestamp
      idx: response.prefetch.locateTo
  - call: DELETE /delete/delete-data
    raw_body: '{"assetIds":["${asset_id}"],"timestamp":${ts}}'
    then:
      - response.status: 200
  - call: POST /get/prefetch?locate=${asset_id}
then:
  - response.status: 200
  - response.json.prefetch.locateTo: null
  - file_absent: /e2e_aid_del/photo.jpg
