name: json absent assertion catches a key the payload does carry
# The negative control for `response.<path> absent`. The metadata detail response
# carries `ext`, so the key asserted here is definitely there and the assertion
# has to fail on it.
#
# The point is that the failure comes from the `absent` branch and not from the
# equality fallback. Before the branch existed, this scenario panicked for a
# different reason — the missing-key case panicked too, so nothing distinguished
# "`absent` works" from "`absent` always fails".
# `an_absent_path_passes_only_when_the_key_does_not_resolve` covers the passing
# half at the unit level; this covers the failing half end to end, so a future
# `absent` that quietly stops asserting cannot ship.
#
# `ext` rather than a key that is merely absent: on `GET /get/get-albums` the
# body is a bare array, so `response.json.length` never resolved and the
# `json_assert_catches_wrong_value` selftest next to this one panics on a
# `Null`/value mismatch rather than on a real field.
given:
  - photo: /e2e_absent_present/photo.jpg
    id_as: $photo
    asset_id_as: $asset_id
when:
  - call: POST /get/prefetch?locate=${asset_id}
    capture:
      token: response.token
      ts: response.prefetch.timestamp
  - call: GET /get/metadata/${asset_id}?timestamp=${ts}
    auth: false
    headers:
      Authorization: "Bearer ${token}"
then:
  - response.status: 200
  - response.json.ext: absent
