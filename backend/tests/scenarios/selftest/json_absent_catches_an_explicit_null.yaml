name: json absent assertion catches an explicit null
# `absent` and `null` are different claims, and this is the case that separates
# them. A photo generated without tags has a metadata detail response whose
# optional fields are *present* and `null` — `metadata_omits_optional_fields_when_the_file_has_none`
# pins that wire shape — so `rating` is not absent, and `response.json.rating:
# absent` has to fail.
#
# An implementation that resolved the path with `navigate_json` could not tell
# this payload from a missing key: serde_json answers both with `Value::Null`.
# The unit test `an_explicit_null_is_not_absent` asserts the two cases separately
# and checks the message names the null; this is the same distinction against a
# real response.
given:
  - photo: /e2e_optional_null/photo.jpg
    id_as: $photo
    asset_id_as: $asset_id
when:
  - call: POST /get/prefetch?locate=${asset_id}
    capture:
      token: response.token
      ts: response.prefetch.timestamp
  - call: GET /get/metadata/${asset_id}?timestamp=${ts}
    auth: false
    headers:
      Authorization: "Bearer ${token}"
then:
  - response.status: 200
  - response.json.rating: absent
