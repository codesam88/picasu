name: assign_album default (no onConflict) is skip, not silent overwrite
# The default should be safe: when dest already has a file with same name,
# the source stays in place and dest is untouched.
given:
  - dir_album: /e2e_default_skip/album
    id_as: $album
  - photo: /e2e_default_skip/album/photo.jpg
  - photo: /e2e_default_skip/import/photo.jpg
    id_as: $photo
when:
  - call: PUT /put/assign_album
    body:
      hash: "${photo}"
      albumId: "${album}"
    # No onConflict → default is Skip
then:
  - response.status: 200
  - file_exists: /e2e_default_skip/import/photo.jpg
  - file_exists: /e2e_default_skip/album/photo.jpg
