name: assign_album on_conflict=merge same name + same hash is a no-op, no rename
# The selected file already lives in the target album dir under the same
# filename; content hash matches. Merge must be a 200 no-op: single alias
# unchanged, no photo-001 rename, file stays put.
given:
  - dir_album: /e2e_mss/album
    id_as: $album
  - photo: /e2e_mss/album/photo.jpg
    id_as: $p
when:
  - call: PUT /put/assign_album
    body:
      hash: "${p}"
      albumId: "${album}"
      onConflict: "merge"
      alias: "/e2e_mss/album/photo.jpg"
    then:
      - response.status: 200
  - call: GET /get/test/record/${p}
then:
  - response.status: 200
  - response.json.aliases.[0].file: "${data_path}/e2e_mss/album/photo.jpg"
  - file_exists: /e2e_mss/album/photo.jpg
  - file_absent: /e2e_mss/album/photo-001.jpg