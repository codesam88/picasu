name: webp without any xmp source has no tags
# Negative control for `webp_metadata_exif_dimensions_thumbnail`: the pinned WebP
# carries no XMP chunk and no sidecar is placed next to it, so nothing about WebP
# indexing may require a tag source. It also proves the tags asserted there came
# from the sidecar file rather than from anything the RIFF container supplied.
given:
  - fixture:
      source: webp-48x32-exif
      destination: /e2e_webp_noxmp/photo.webp
    id_as: $photo
    asset_id_as: $asset_id
when:
  - call: POST /get/prefetch?locate=${asset_id}
    capture:
      token: response.token
      ts: response.prefetch.timestamp
  - call: GET /get/metadata/${asset_id}?timestamp=${ts}
    auth: false
    headers:
      Authorization: "Bearer ${token}"
then:
  - response.status: 200
  - response.json.tags: []
