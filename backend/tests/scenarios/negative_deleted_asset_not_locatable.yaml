name: "negative: deleted asset cannot be located"
# After an asset's file is deleted and the record purged, its asset_id
# must no longer resolve in locate or serve.
given:
  - dir_album: /e2e_neg_del/album
    id_as: $album
  - photo: /e2e_neg_del/album/photo.jpg
    id_as: $photo
    asset_id_as: $asset_id
when:
  - call: POST /post/index/album
    raw_body: '{"album": "/e2e_neg_del"}'
    then:
      - response.status: 202
  - wait_index: true
  # Verify it's locatable before delete.
  - call: POST /get/prefetch?locate=${asset_id}
    capture:
      ts: response.prefetch.timestamp
    then:
      - response.status: 200
      - response.json.prefetch.locateTo: 0
  # Delete the asset by asset_id.
  - call: DELETE /delete/delete-data
    raw_body: '{"assetIds":["${asset_id}"],"timestamp":${ts}}'
    then:
      - response.status: 200
  # Re-index.
  - call: POST /post/index/album
    raw_body: '{"album": "/e2e_neg_del"}'
    then:
      - response.status: 202
  - wait_index: true
  # Attempt to locate the deleted asset.
  - call: POST /get/prefetch?locate=${asset_id}
then:
  - response.status: 200
  # Deleted asset must not be locatable.
  - response.json.prefetch.locateTo: null
