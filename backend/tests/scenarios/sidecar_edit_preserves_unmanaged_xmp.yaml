name: editing a managed field leaves unmanaged XMP in the sidecar alone
# A sidecar is a shared file. This one was written by something other than
# picasu and carries properties in namespaces the app does not model — a
# location, a camera make, a rights flag, a property from a namespace no reader
# here has a rule for at all.
#
# The write path is a read-modify-write through xmpkit (`XmpMeta::parse` →
# set the managed fields → `serialize_packet`), so editing one managed field
# must leave all of that where it was. The writer this replaces rewrote the
# whole `.xmp` from the app's four managed fields, which deleted every one of
# these properties on the first tag edit — silently, and on data no view here
# can even show.
#
# One edit does both halves of the contract: it adds a tag and removes the one
# the index took from this sidecar, so the assertions can say the bag is the
# app's tag set *exactly* — the removed tag gone, the added one present — while
# every unmanaged property is still in the packet. A writer that appended to the
# bag would pass the preservation assertions and fail the removal one.
#
# Asserted on the file's bytes after the edit, not on the API response: the
# response can only show what the app models, which is exactly the part that was
# never at risk. Assertions pin semantic content (property names and values),
# never packet bytes.
given:
  - photo: /e2e_rmw/photo.jpg
    id_as: $photo
    asset_id_as: $asset_id
  - raw_file: /e2e_rmw/photo.xmp
    content: |
      <?xpacket begin="" id="W5M0MpCehiHzreSzNTczkc9d"?>
      <x:xmpmeta xmlns:x="adobe:ns:meta/">
      <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
      <rdf:Description rdf:about=""
        xmlns:dc="http://purl.org/dc/elements/1.1/"
        xmlns:xmp="http://ns.adobe.com/xap/1.0/"
        xmlns:xmpRights="http://ns.adobe.com/xap/1.0/rights/"
        xmlns:photoshop="http://ns.adobe.com/photoshop/1.0/"
        xmlns:tiff="http://ns.adobe.com/tiff/1.0/"
        xmlns:Iptc4xmpCore="http://iptc.org/std/Iptc4xmpCore/1.0/xmlns/">
        <dc:subject><rdf:Bag>
        <rdf:li>e2e_seed_tag</rdf:li>
        </rdf:Bag></dc:subject>
        <xmp:Rating>2</xmp:Rating>
        <xmpRights:Marked>True</xmpRights:Marked>
        <photoshop:City>Zürich</photoshop:City>
        <tiff:Make>SeedCam</tiff:Make>
        <Iptc4xmpCore:Location>Alps</Iptc4xmpCore:Location>
      </rdf:Description>
      </rdf:RDF>
      </x:xmpmeta>
      <?xpacket end="w"?>
when:
  - call: POST /get/prefetch?locate=${asset_id}
    capture:
      ts: response.prefetch.timestamp
      idx: response.prefetch.locateTo
  - call: PUT /put/edit_tag
    raw_body: '{"indexArray":[${idx}],"addTagsArray":["e2e_added"],"removeTagsArray":["e2e_seed_tag"],"timestamp":${ts}}'
then:
  - response.status: 200
  # The managed fields the edit was about did land, and only them.
  - file.contains: /e2e_rmw/photo.xmp
    text: e2e_added
  - file.not_contains: /e2e_rmw/photo.xmp
    text: e2e_seed_tag
  # Every unmanaged property is still in the packet, still with its value.
  - file.contains: /e2e_rmw/photo.xmp
    text: Iptc4xmpCore:Location
  - file.contains: /e2e_rmw/photo.xmp
    text: Alps
  - file.contains: /e2e_rmw/photo.xmp
    text: photoshop:City
  - file.contains: /e2e_rmw/photo.xmp
    text: Zürich
  - file.contains: /e2e_rmw/photo.xmp
    text: tiff:Make
  - file.contains: /e2e_rmw/photo.xmp
    text: SeedCam
  # `xmpRights:Marked` shares the XMP namespace with the managed `xmp:Rating`, so
  # it fails a writer that replaced a namespace rather than a property.
  - file.contains: /e2e_rmw/photo.xmp
    text: xmpRights:Marked
