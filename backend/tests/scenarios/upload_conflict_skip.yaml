name: Upload with on_conflict=skip leaves the colliding file untouched
given:
  - dir_album: /e2e_up_skip/target
    id_as: $album
  - photo: /e2e_up_skip/src/photo.jpg
when:
  - upload:
      file: /e2e_up_skip/src/photo.jpg
      target_album: "${album}"
      on_conflict: skip
    asset_id_as: $asset_id
    discover_path: /e2e_up_skip/target/photo.jpeg
    then:
      - response.status: 200
  - upload:
      file: /e2e_up_skip/src/photo.jpg
      target_album: "${album}"
      on_conflict: skip
    then:
      - response.status: 200
  - call: POST /get/prefetch
    body: { Album: "${album}" }
    capture:
      token: response.token
      ts: response.prefetch.timestamp
      end: response.prefetch.dataLength
then:
  - response.status: 200
  - file_exists: /e2e_up_skip/target/photo.jpeg
  - file_absent: /e2e_up_skip/target/photo-001.jpeg
  - response.json.prefetch.dataLength: 2
