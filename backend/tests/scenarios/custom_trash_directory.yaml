name: delete uses custom trash directory
given:
  - config:
      trash_directory: ".picasu_trash"
  - photo: /e2e_custom_trash/photo.jpg
    id_as: $photo
when:
  - call: POST /get/prefetch?locate=${photo}
    capture:
      ts: response.prefetch.timestamp
      idx: response.prefetch.locateTo
  - call: DELETE /delete/delete-data
    raw_body: '{"deleteList":[{"index":${idx},"aliasPath":"${image_home}/e2e_custom_trash/photo.jpg"}],"timestamp":${ts}}'
then:
  - response.status: 200
  - file_absent: /e2e_custom_trash/photo.jpg
  - file_exists: /.picasu_trash/e2e_custom_trash/photo.jpg
