name: mov without any xmp source has no tags
# Negative control for `mov_ffprobe_metadata_dimensions_thumbnail`: the pinned
# QuickTime fixture carries no XMP packet and no sidecar is placed next to it, so
# the tags asserted there came from `clip.xmp` alone. The mp4 counterpart is
# `mp4_without_xmp_source_has_no_tags`.
given:
  - fixture:
      source: mov-48x32-ffprobe
      destination: /e2e_mov_noxmp/clip.mov
    id_as: $photo
    asset_id_as: $asset_id
when:
  - call: POST /get/prefetch?locate=${asset_id}
    capture:
      token: response.token
      ts: response.prefetch.timestamp
  - call: GET /get/metadata/${asset_id}?timestamp=${ts}
    auth: false
    headers:
      Authorization: "Bearer ${token}"
then:
  - response.status: 200
  - response.json.tags: []
  - "response.json.exifVec.TAG:major_brand": "qt  "
