name: delete with trash disabled performs permanent delete immediately
given:
  - config:
      trash_enabled: false
  - photo: /e2e_trash_disabled/photo.jpg
    id_as: $photo
when:
  - call: POST /get/prefetch?locate=${photo}
    capture:
      ts: response.prefetch.timestamp
      idx: response.prefetch.locateTo
  - call: DELETE /delete/delete-data
    raw_body: '{"deleteList":[{"index":${idx},"aliasPath":"${image_home}/e2e_trash_disabled/photo.jpg"}],"timestamp":${ts}}'
then:
  - response.status: 200
  - file_absent: /e2e_trash_disabled/photo.jpg
  - file_absent: /e2e_trash_disabled/.trash/photo.jpg
