name: assign_album on_conflict=merge same filename but different content auto-renames via photo-001
# Filename collision with DIFFERENT content (distinct blake3 hash): merge must
# fall through to a safe auto-rename (photo-001.jpg), never overwrite the
# existing album file, and move the source in.
given:
  - dir_album: /e2e_msd/album
    id_as: $album
  - photo: /e2e_msd/album/photo.jpg
  - photo: /e2e_msd/src/photo.jpg
    id_as: $src
when:
  - call: PUT /put/assign_album
    body:
      hash: "${src}"
      albumId: "${album}"
      onConflict: "merge"
      alias: "${data_path}/e2e_msd/src/photo.jpg"
    then:
      - response.status: 200
  - call: GET /get/test/record/${src}
then:
  - response.status: 200
  - response.json.aliases.[0].file: "${data_path}/e2e_msd/album/photo-001.jpg"
  - file_exists: /e2e_msd/album/photo.jpg
  - file_exists: /e2e_msd/album/photo-001.jpg
  - file_absent: /e2e_msd/src/photo.jpg