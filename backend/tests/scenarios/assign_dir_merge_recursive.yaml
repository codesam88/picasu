name: assign_album on_conflict=merge dir moves recursively migrate content and drop emptied sub-album records
# Dir (sub-album) recursive merge. Selecting a source album whose tree already
# hybridizes with content: merge should migrate the tree's leaf files up into
# the target album dir, then remove the emptied source dirs and their dir-album
# records. A separate guard step asserts that assigning a dir into its own
# descendant is rejected (400). Note: a "blocked file keeps its containing dir
# and all ancestors" variant is not expressible in the current harness (no way
# to deterministically force a single-file move failure), so it is not covered
# here.
given:
  - dir_album: /e2e_mr9/dest
    id_as: $dest
  - dir_album: /e2e_mr9/source
    id_as: $source
  - photo: /e2e_mr9/source/root.jpg
  - dir_album: /e2e_mr9/source/sub
    id_as: $sub
  - photo: /e2e_mr9/source/sub/leaf.jpg
when:
  # Guard: a dir album cannot be assigned into its own descendant.
  - call: PUT /put/assign_album
    body:
      hash: "${source}"
      albumId: "${sub}"
      onConflict: "merge"
    then:
      - response.status: 400
  # Recursive merge of the whole source tree into the dest album dir.
  - call: PUT /put/assign_album
    body:
      hash: "${source}"
      albumId: "${dest}"
      onConflict: "merge"
    then:
      - response.status: 200
  # Probe the (former) source album record: it must be gone after its dir was
  # emptied and removed.
  - call: GET /get/test/record/${source}
then:
  - response.status: 404
  # Leaf files migrated up to the target album root; source tree emptied.
  - file_exists: /e2e_mr9/dest/root.jpg
  - file_exists: /e2e_mr9/dest/leaf.jpg
  - file_absent: /e2e_mr9/source/root.jpg
  - file_absent: /e2e_mr9/source/sub/leaf.jpg