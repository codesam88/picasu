name: "watcher sidecar - modifying xmp sidecar triggers re-index of associated media"
given:
  - photo: /watcher_sidecar/photo.jpg
    id_as: $photo
    asset_id_as: $asset_id

when:
  # Index the file.
  - call: POST /post/index/album
    raw_body: '{"album": "/"}'
    then:
      - response.status: 202
  - wait_index: true

  # Create an XMP sidecar by editing a tag.
  - call: POST /get/prefetch?locate=${asset_id}
    capture:
      ts: response.prefetch.timestamp
      idx: response.prefetch.locateTo
      token: response.token
  - call: PUT /put/edit_tag
    raw_body: '{"indexArray":[${idx}],"addTagsArray":["sidecar_tag"],"removeTagsArray":[],"timestamp":${ts}}'
    then:
      - response.status: 200
      - file_exists: /watcher_sidecar/photo.xmp

  # Verify the tag is present.
  - call: POST /get/prefetch?locate=${asset_id}
    capture:
      ts2: response.prefetch.timestamp
      idx2: response.prefetch.locateTo
      token2: response.token
    calc:
      end2: "${idx2}+1"
  - call: GET /get/get-data?timestamp=${ts2}&start=${idx2}&end=${end2}
    auth: false
    headers:
      Authorization: "Bearer ${token2}"
    then:
      - response.status: 200

  # Overwrite the sidecar with different content (simulate external edit).
  - write_file: /watcher_sidecar/photo.xmp
    content: "<x:xmpmeta><rdf:RDF><rdf:Description><dc:subject><rdf:Bag><rdf:li>modified_tag</rdf:li></rdf:Bag></dc:subject></rdf:Description></rdf:RDF></x:xmpmeta>"
  - wait_index: true

  # Re-index to pick up the sidecar change.
  - call: POST /post/index/album
    raw_body: '{"album": "/"}'
    then:
      - response.status: 202
  - wait_index: true

  # Verify the file still exists.
  - call: POST /get/prefetch?locate=${asset_id}
    then:
      - response.status: 200

then:
  - file_exists: /watcher_sidecar/photo.jpg
  - file_exists: /watcher_sidecar/photo.xmp
