name: re-uploading identical content creates a new visible asset
# Path-primary contract: uploading identical content creates a new asset,
# not a new path entry on the existing record. The new asset is visible
# regardless of the original's trash state.
given:
  - dir_album: /e2e_reup/pool
    id_as: $album
  - photo: /e2e_reup/pool/photo.jpg
    id_as: $p1
    asset_id_as: $asset_id
when:
  # Trash the first photo.
  - call: POST /get/prefetch?locate=${asset_id}
    capture:
      ts: response.prefetch.timestamp
      idx: response.prefetch.locateTo
  - call: PUT /put/edit_flags
    raw_body: '{"indexArray":[${idx}],"timestamp":${ts},"isTrashed":true}'
    then:
      - response.status: 200
  # Upload a byte-identical copy into the same album directory.
  - upload:
      file: /e2e_reup/pool/photo.jpg
      filename: photo_up.jpg
      target_album: "${album}"
    then:
      - response.status: 200
  # Re-index.
  - call: POST /post/index/album
    raw_body: '{"album": "/e2e_reup"}'
    then:
      - response.status: 202
  - wait_index: true
  # Query the album for non-trashed items.
  - call: POST /get/prefetch
    body: { Album: "${album}" }
then:
  - response.status: 200
  # The album should have at least the placeholder + the uploaded copy.
  - compare:
      response.json.prefetch.dataLength: { ">=": 1 }
