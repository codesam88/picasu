name: a sidecar replaces the XMP source while the image's IPTC still fills tags
# Sidecar precedence, safe direction — the control for
# `corrupt_xmp_sidecar_suppresses_embedded_xmp`.
#
# Same two files as that scenario, with a sidecar that parses. The JPEG still
# carries an embedded packet, and snapfab's writer has put the same keyword in
# that packet and in an IIM record; the sidecar holds a packet of its own, with
# a caption of its own.
#
# The contract settled in `.plan/exiftool-metadata-engine.md` decision 6 has two
# halves, and this scenario pins both in one response:
#
#   * The sidecar is the **XMP source**, so the description is the sidecar's
#     caption. A sidecar wins the XMP source because that is where the app
#     writes metadata back (`PUT /put/edit_tag`); reading the embedded packet
#     instead would undo the edit with a stale value. This assertion is what
#     carries the scenario's name.
#   * The image's own IIM record is a *different* source and is unioned in, so
#     the file's keyword is indexed even though the sidecar never mentioned it.
#     This file used to assert that keyword `absent`, which held only of the
#     retired byte scan (it resolved one source and read nothing else).
#
# Asserted on the metadata response rather than on `GET /get/get-tags`, because
# that is the one call whose body carries both fields; the harness only
# evaluates body assertions against the last call's response.
given:
  - photo: /e2e_sidecar_wins/photo.jpg
    tags:
      - e2e_sidecar_embedded
    id_as: $photo
    asset_id_as: $asset_id
  - raw_file: /e2e_sidecar_wins/photo.xmp
    content: |
      <x:xmpmeta xmlns:x="adobe:ns:meta/">
      <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
      <rdf:Description xmlns:dc="http://purl.org/dc/elements/1.1/">
      <dc:subject><rdf:Bag>
      <rdf:li>e2e_sidecar_written</rdf:li>
      </rdf:Bag></dc:subject>
      <dc:description><rdf:Alt>
      <rdf:li xml:lang="x-default">Caption written to the sidecar</rdf:li>
      </rdf:Alt></dc:description>
      </rdf:Description>
      </rdf:RDF>
      </x:xmpmeta>
when:
  - call: GET /get/index/status
    then:
      - response.status: 200
  - call: POST /get/prefetch?locate=${asset_id}
    capture:
      token: response.token
      ts: response.prefetch.timestamp
  - call: GET /get/metadata/${asset_id}?timestamp=${ts}
    auth: false
    headers:
      Authorization: "Bearer ${token}"
then:
  - response.status: 200
  - response.json.tags:
      contains: e2e_sidecar_written
  # The image's own IIM 2:25 keywords are unioned in rather than suppressed.
  - response.json.tags:
      contains: e2e_sidecar_embedded
  # XMP outranks IPTC: the sidecar's caption, not the fixture's own.
  - response.json.description: "Caption written to the sidecar"
