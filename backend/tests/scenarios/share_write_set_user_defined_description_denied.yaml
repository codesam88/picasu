name: share credentials are denied on set_user_defined_description
given:
  - dir_album: /e2e_share_write_desc/album
    id_as: $album_id
  - photo: /e2e_share_write_desc/album/photo.jpg
    id_as: $photo
    asset_id_as: $asset_id
when:
  - call: POST /get/prefetch?locate=${asset_id}
    capture:
      ts: response.prefetch.timestamp
      idx: response.prefetch.locateTo
    then:
      - response.status: 200
  - call: POST /post/create_share
    body:
      albumId: "${album_id}"
      description: "share"
      password: null
      showMetadata: true
      showDownload: true
      showUpload: true
      exp: 0
    capture:
      share_id: response
    then:
      - response.status: 200
  - call: PUT /put/set_user_defined_description
    raw_body: '{"index":${idx},"description":"shared desc","timestamp":${ts}}'
    auth: false
    headers:
      x-album-id: "${album_id}"
      x-share-id: "${share_id}"
    then:
      - response.status: 401
then:
  - response.status: 401
