name: restore via assign_album returns trashed image to original album
# Covers the trash-page "Restore" action: instead of a dedicated untrash
# endpoint, restore is implemented as assign_album targeting the item's
# original album. Moving the file out of .trash/ back into that directory
# un-trashes it. cleanupEmptySource purges the now-empty trash directory.
given:
  - dir_album: /e2e_untrash_album
    id_as: $album
  - photo: /e2e_untrash_album/photo.jpg
    id_as: $photo
when:
  - call: POST /get/prefetch?locate=${photo}
    capture:
      ts: response.prefetch.timestamp
      idx: response.prefetch.locateTo
  - call: DELETE /delete/delete-data
    raw_body: '{"deleteList":[{"index":${idx},"aliasPath":"${image_home}/e2e_untrash_album/photo.jpg"}],"timestamp":${ts}}'
    then:
      - response.status: 200
      - file_absent: /e2e_untrash_album/photo.jpg
      - file_exists: /.trash/e2e_untrash_album/photo.jpg
  - call: PUT /put/assign_album
    body:
      hash: "${photo}"
      albumId: "${album}"
      onConflict: "rename"
      cleanupEmptySource: true
    then:
      - response.status: 200
then:
  - file_exists: /e2e_untrash_album/photo.jpg
  - file_absent: /.trash/e2e_untrash_album/photo.jpg
  - file_absent: /.trash/e2e_untrash_album
