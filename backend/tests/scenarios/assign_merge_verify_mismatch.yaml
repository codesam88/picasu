name: assign_album on_conflict=merge verify-mismatch errors and does not delete the source
# When the SELECTED alias's on-disk bytes no longer match the recorded hash, the
# merge must error (verify mismatch) and leave both files untouched — the source
# is NOT deleted and no move happens. The harness has no post-index file-write
# verb, so corruption is emulated by selecting an alias path whose bytes hash to
# a different record ($t) than the one being assigned ($src).
given:
  - dir_album: /e2e_mvm/album
    id_as: $album
  - photo: /e2e_mvm/good/g.jpg
    id_as: $src
  - photo: /e2e_mvm/tampered/t.jpg
    id_as: $t
when:
  - call: PUT /put/assign_album
    body:
      hash: "${src}"
      albumId: "${album}"
      onConflict: "merge"
      alias: "/e2e_mvm/tampered/t.jpg"
then:
  - response.status_not: 200
  # Verify-mismatch surfaces as an app error (JSON body), not a transport 4xx.
  - response.json.kind: "InvalidInput"
  # Source (corrupt selected alias) is NOT deleted.
  - file_exists: /e2e_mvm/tampered/t.jpg
  # The good original is not moved out of its source location.
  - file_exists: /e2e_mvm/good/g.jpg