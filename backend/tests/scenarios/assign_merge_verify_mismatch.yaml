name: assign_album on_conflict=merge verify-mismatch errors and does not delete the source
# Genuine hash verification: a valid source record has a byte-identical
# duplicate already resident in the target album dir (a dedup candidate). The
# SOURCE's on-disk bytes are then corrupted post-index with the write_file verb,
# so when merge selects the source its recorded-hash check fails. The assign
# must error (InvalidInput) and leave BOTH files on disk untouched — the
# corrupted source is NOT deleted and no move happens.
given:
  - dir_album: /e2e_mvm/album
    id_as: $album
  - photo: /e2e_mvm/src/same.jpg
    id_as: $src
when:
  # Byte-identical duplicate of the source into the album -> record gains a
  # second alias: [src/same.jpg, album/photo.jpeg].
  - upload:
      file: /e2e_mvm/src/same.jpg
      filename: photo.jpg
      target_album: "${album}"
      on_conflict: rename
    then:
      - response.status: 200
  # Re-index so the dedup task merges the album copy into the source record.
  - call: POST /post/index/album
    raw_body: '{"album": "/e2e_mvm"}'
    then:
      - response.status: 202
  - wait_index: true
  # Corrupt the SOURCE file's bytes post-index so its hash no longer matches.
  - write_file: /e2e_mvm/src/same.jpg
    content: "corrupted source bytes"
  # Merge selecting the corrupted source: hash verify fails -> error, no delete.
  - call: PUT /put/assign_album
    body:
      hash: "${src}"
      albumId: "${album}"
      onConflict: "merge"
      alias: "${data_path}/e2e_mvm/src/same.jpg"
then:
  - response.status_not: 200
  # Verify-mismatch surfaces as an app error (JSON body), not a transport 4xx.
  - response.json.kind: "InvalidInput"
  # The corrupted source is NEVER deleted.
  - file_exists: /e2e_mvm/src/same.jpg
  # The album-resident duplicate copy also survives untouched.
  - file_exists: /e2e_mvm/album/photo.jpeg