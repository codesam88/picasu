name: a rating edit whose sidecar cannot be written leaves the cache alone
# The rating half of the same contract as
# `a_tag_edit_whose_sidecar_cannot_be_written_leaves_the_cache_alone`.
#
# A rating is a single scalar with no free text, so "unchanged" is one exact
# value in the cache and one exact element in the file — and the file assertion
# is deliberately the seeded element rather than "does not contain 5", because
# a write that landed would replace the element rather than edit it.
given:
  - photo: /e2e_ro_rating/photo.jpg
    id_as: $photo
    asset_id_as: $asset_id
  - raw_file: /e2e_ro_rating/photo.xmp
    content: |
      <?xpacket begin="" id="W5M0MpCehiHzreSzNTczkc9d"?>
      <x:xmpmeta xmlns:x="adobe:ns:meta/">
      <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
      <rdf:Description rdf:about=""
        xmlns:dc="http://purl.org/dc/elements/1.1/"
        xmlns:xmp="http://ns.adobe.com/xap/1.0/">
        <xmp:Rating>1</xmp:Rating>
      </rdf:Description>
      </rdf:RDF>
      </x:xmpmeta>
      <?xpacket end="w"?>
when:
  - call: POST /get/prefetch?locate=${asset_id}
    capture:
      ts: response.prefetch.timestamp
      idx: response.prefetch.locateTo
  - chmod:
      path: /e2e_ro_rating
      octal: "0500"
  - call: PUT /put/edit_rating
    raw_body: '{"indexArray":[${idx}],"timestamp":${ts},"rating":5}'
    then:
      - response.status: 500
  - chmod:
      path: /e2e_ro_rating
      octal: "0755"
  - call: POST /get/prefetch?locate=${asset_id}
    capture:
      token: response.token
      ts: response.prefetch.timestamp
    then:
      - response.status: 200
  - call: GET /get/metadata/${asset_id}?timestamp=${ts}
    auth: false
    headers:
      Authorization: "Bearer ${token}"
then:
  - response.status: 200
  - response.json.rating: 1
  - file.contains: /e2e_ro_rating/photo.xmp
    text: "<xmp:Rating>1</xmp:Rating>"
  - file.not_contains: /e2e_ro_rating/photo.xmp
    text: "<xmp:Rating>5</xmp:Rating>"
