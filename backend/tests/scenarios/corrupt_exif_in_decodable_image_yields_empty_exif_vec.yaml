name: corrupt EXIF inside a decodable image yields an empty exifVec and nothing else changes
# Negative case: metadata corruption *inside* an otherwise decodable image.
#
# The patch replaces the TIFF byte-order marker that follows the JPEG `Exif\0\0`
# header (`II*\0` → `II*\xff`) without changing the file length, so the JPEG
# structure — segments, quantisation tables, scan data — is untouched and the
# image still decodes.
#
# Expected outcome: everything the pixels provide survives (dimensions, `ext`,
# the thumbnail, and the XMP keywords carried in a different APP1 segment) and
# only the EXIF block is lost, as an *empty object* rather than an error.
# `generate_exif_for_image` is documented non-fallible: it swallows every
# failure of `read_exif` and returns whatever it managed to read, which for an
# unparseable block is nothing. So the API answers 200 with `exifVec: {}` —
# a corrupt EXIF block never turns into a 4xx, a 5xx, or a panic.
#
# Positive control: `jpeg`-shaped EXIF reaching the API is pinned by
# `png_metadata_exif_dimensions_thumbnail.yaml` and
# `photo_tags_reflect_injected_metadata_b.yaml`; this scenario is the negative
# half of that pair, on the same generated-JPEG shape.
given:
  - photo: /e2e_corrupt_exif/photo.jpg
    tags:
      - e2e_corrupt_exif_embedded
    id_as: $photo
    asset_id_as: $asset_id
  - patch_file:
      path: /e2e_corrupt_exif/photo.jpg
      find_hex: "45786966000049492a00"
      replace_hex: "45786966000049492aff"
when:
  - call: POST /get/prefetch?locate=${asset_id}
    capture:
      token: response.token
      ts: response.prefetch.timestamp
  - call: GET /get/metadata/${asset_id}?timestamp=${ts}
    auth: false
    headers:
      Authorization: "Bearer ${token}"
then:
  - response.status: 200
  - response.json.ext: jpg
  # The generated fixture is minimal, so the decoded size is 2x2.
  - response.json.width: 2
  - response.json.height: 2
  # The whole EXIF block is gone, and gone as an empty object: the field is
  # present with no entries rather than absent.
  - response.json.exifVec: {}
  # A separate APP1 segment is untouched, which is what makes this "corrupt
  # metadata" rather than "unreadable file".
  - response.json.tags:
      contains: e2e_corrupt_exif_embedded
  - thumb_exists: $photo
