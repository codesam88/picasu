name: corrupt EXIF inside a decodable image yields an empty exifVec and nothing else changes
# Negative case: metadata corruption *inside* an otherwise decodable image.
#
# The patch replaces the TIFF byte-order word that follows the JPEG `Exif\0\0`
# header (`MM\0*` → `XY\0*`) without changing the file length, so the JPEG
# structure — segments, quantisation tables, scan data — is untouched and the
# image still decodes.
#
# Which byte order the fixture carries is the generator's business, not this
# scenario's: a TIFF block may start with `II*\0` or `MM\0*`, ExifTool writes
# `MM\0*`, and a file from a camera is either. The `find_hex` below is
# therefore the header as the generator actually writes it, and what the
# scenario tests is the *word* — corrupting the byte-order marker itself,
# whichever it is. `process::exif`'s
# `a_corrupt_exif_block_yields_an_empty_map_while_the_image_stays_valid`
# discovers the marker in the bytes and covers both orders, so a change of
# writer is caught there rather than here.
#
# The damaged byte-order marker is load-bearing: it is damage ExifTool cannot
# work around. Measured with exiftool 13.59, corrupting the *IFD offset* instead
# (which shares the last two bytes of a big-endian byte-order word) still yields
# every tag, because the directory is located by scanning when the offset is
# wrong, so that patch produces a full `exifVec` rather than an empty one. An
# invalid byte-order marker has no fallback: the engine reports
# `Malformed APP1 EXIF segment` and extracts nothing.
#
# Expected outcome: everything the pixels provide survives (dimensions, `ext`,
# the thumbnail, and the XMP keywords carried in a different APP1 segment) and
# only the EXIF block is lost, as an *empty object* rather than an error.
# `generate_exif_for_image` is documented non-fallible: it swallows every
# failure to read EXIF and returns whatever it managed to read, which for an
# unreadable block is nothing. So the API answers 200 with `exifVec: {}` —
# a corrupt EXIF block never turns into a 4xx, a 5xx, or a panic.
#
# Positive control: `jpeg`-shaped EXIF reaching the API is pinned by
# `png_metadata_exif_dimensions_thumbnail.yaml` and
# `photo_tags_reflect_injected_metadata_b.yaml`; this scenario is the negative
# half of that pair, on the same generated-JPEG shape.
given:
  - photo: /e2e_corrupt_exif/photo.jpg
    tags:
      - e2e_corrupt_exif_embedded
    id_as: $photo
    asset_id_as: $asset_id
  - patch_file:
      path: /e2e_corrupt_exif/photo.jpg
      # `Exif\0\0` then the big-endian byte-order word `MM\0*`, with the two
      # marker letters replaced by `XY` — same length, same segment, unreadable.
      find_hex: "4578696600004d4d002a"
      replace_hex: "4578696600005859002a"
when:
  - call: POST /get/prefetch?locate=${asset_id}
    capture:
      token: response.token
      ts: response.prefetch.timestamp
  - call: GET /get/metadata/${asset_id}?timestamp=${ts}
    auth: false
    headers:
      Authorization: "Bearer ${token}"
then:
  - response.status: 200
  - response.json.ext: jpg
  # The generated fixture is minimal, so the decoded size is 2x2.
  - response.json.width: 2
  - response.json.height: 2
  # The whole EXIF block is gone, and gone as an empty object: the field is
  # present with no entries rather than absent.
  - response.json.exifVec: {}
  # A separate APP1 segment is untouched, which is what makes this "corrupt
  # metadata" rather than "unreadable file".
  - response.json.tags:
      contains: e2e_corrupt_exif_embedded
  - thumb_exists: $photo
