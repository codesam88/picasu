name: upload on_conflict=merge re-upload of identical content dedups, no second file on disk
# Upload an identical file into the album a second time with on_conflict=merge.
# Merge must dedup back onto the album-resident copy (single file, no -001
# suffix) and return 200.
given:
  - dir_album: /e2e_um/album
    id_as: $album
  - photo: /e2e_um/src/p.jpg
when:
  - upload:
      file: /e2e_um/src/p.jpg
      target_album: "${album}"
      on_conflict: rename
    then:
      - response.status: 200
  - upload:
      file: /e2e_um/src/p.jpg
      target_album: "${album}"
      on_conflict: merge
then:
  - response.status: 200
  - file_exists: /e2e_um/album/p.jpeg
  - file_absent: /e2e_um/album/p-001.jpeg