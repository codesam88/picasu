name: a corrupt XMP sidecar withholds every managed field, the file's IIM included
# Sidecar precedence, as amended by `.plan/test-exif-xmp-handling.md`, Follow-up
# Issues → "Sidecar Edits Must Override Embedded Metadata", which amends decision
# 6 of `.plan/exiftool-metadata-engine.md`.
#
# The contract: **when a sidecar exists it is the complete authority for the
# managed fields** — `tags`, `description`, `rating`, `title` come from the
# sidecar alone, and a field it does not carry is empty. This file is the
# unreadable-sidecar corner of that rule, and it is the one place the two prior
# contracts are visible in the same scenario:
#
#   * `.plan/test-exif-xmp-handling.md` originally pinned "a corrupt sidecar
#     suppresses everything the file carries" — right for the wrong reason, since
#     the retired byte scan resolved a single source and read nothing else.
#   * `.plan/exiftool-metadata-engine.md` decision 6 amended that to "a sidecar
#     replaces the **XMP source only** — IPTC and PNG-text still fill native
#     fields", which made the assertion below `present`.
#   * The follow-up amends *that*: the union of the sidecar's `dc:subject` with
#     the file's IIM 2:25 `Keywords` is what resurrected a removed tag on the
#     next index, and a clear-then-reindex handed back the file's IIM caption. So
#     the assertion is `absent` again, now for the right reason: the sidecar is
#     the record, and a record that could not be read is empty.
#
# The price is visible in this very scenario and is accepted: a file with a
# corrupt sidecar indexes with no tags and no description, even though its own
# bytes carry both. `write_sidecar_for` would replace such a sidecar on the app's
# next edit, so the state is not durable for an app-managed asset — it is the
# observable outcome for a file the app has never touched, which is the only way
# such a sidecar normally arises.
#
# The control is `sidecar_xmp_is_authoritative_over_embedded_xmp`: the same two
# files with a sidecar that parses, where the sidecar's own values are what
# reach the fields.
#
# Also asserted: a corrupt sidecar does not fail the index. The file is
# readable, so the job is `completed` with no failures — the contract is about
# which values are read, not about whether the asset indexes at all.
given:
  - photo: /e2e_corrupt_xmp/photo.jpg
    tags:
      - e2e_corrupt_xmp_embedded
  - raw_file: /e2e_corrupt_xmp/photo.xmp
    content: |
      <x:xmpmeta><rdf:RDF><dc:subject><rdf:Bag>
      <rdf:li>e2e_corrupt_xmp_unclosed
when:
  - call: GET /get/index/status
    then:
      - response.status: 200
  - call: GET /get/get-tags
then:
  - response.status: 200
  # The XMP source is the corrupt sidecar, so nothing it holds is indexed.
  - array_where:
      where:
        tag: e2e_corrupt_xmp_unclosed
      expect: absent
  # The image's own IIM 2:25 keywords are not indexed either. snapfab's JPEG
  # writer puts `e2e_corrupt_xmp_embedded` in an XMP packet *and* in an IIM
  # record, so under decision 6 this arrived through IIM and the assertion was
  # `present`; under the follow-up's complete-authority rule the sidecar is the
  # record for `tags` and a record that yields nothing means no tags.
  - array_where:
      where:
        tag: e2e_corrupt_xmp_embedded
      expect: absent
