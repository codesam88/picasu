name: a corrupt XMP sidecar suppresses the embedded XMP packet, not the file's IPTC
# Sidecar precedence, rewritten for the contract settled in
# `.plan/exiftool-metadata-engine.md` decision 6, which overturns the pin this
# file originally carried.
#
# A sidecar's existence replaces the **XMP source only**. The sidecar here is
# truncated markup, so no XMP field is filled from it — and the packet embedded
# in the JPEG is not consulted in its place, because the sidecar is where the
# app writes metadata back (`PUT /put/edit_tag`), so reading the stale embedded
# packet would undo the edit.
#
# The image's own IPTC record is a different source and still fills: snapfab's
# JPEG writer puts `e2e_corrupt_xmp_embedded` in an XMP packet *and* in an IIM
# record, so the keyword reaches the index through IIM 2:25 `Keywords` even
# though the XMP source yielded nothing.
#
# The withdrawn contract: this file used to assert
# `e2e_corrupt_xmp_embedded: absent` under the rule that "a corrupt sidecar
# suppresses everything the file carries". That was a consequence of the retired
# byte scan, which resolved a single source — `discover_sidecar(path)` or else
# the file — and read nothing else. The engine swap reads the image for its IPTC
# and text chunks regardless, so the keyword is indexed and the assertion below
# is `present`.
#
# The control is `sidecar_xmp_is_authoritative_over_embedded_xmp`: the same two
# files with a readable sidecar, where the sidecar's own description is what
# reaches the field.
#
# Also asserted: a corrupt sidecar does not fail the index. The file is
# readable, so the job is `completed` with no failures; only the sidecar's own
# keyword is lost.
given:
  - photo: /e2e_corrupt_xmp/photo.jpg
    tags:
      - e2e_corrupt_xmp_embedded
  - raw_file: /e2e_corrupt_xmp/photo.xmp
    content: |
      <x:xmpmeta><rdf:RDF><dc:subject><rdf:Bag>
      <rdf:li>e2e_corrupt_xmp_unclosed
when:
  - call: GET /get/index/status
    then:
      - response.status: 200
  - call: GET /get/get-tags
then:
  - response.status: 200
  # The XMP source is the corrupt sidecar, so nothing it holds is indexed.
  - array_where:
      where:
        tag: e2e_corrupt_xmp_unclosed
      expect: absent
  # The image's own IPTC record is not part of the XMP source, so the keyword
  # the file carries in IIM 2:25 `Keywords` is indexed. Before the engine swap
  # this was `absent`; see the header.
  - array_where:
      where:
        tag: e2e_corrupt_xmp_embedded
      expect: present
