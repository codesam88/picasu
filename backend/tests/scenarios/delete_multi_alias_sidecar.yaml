name: deleting an asset removes its own xmp sidecar while other same-hash assets survive
# Path-primary contract: each file is an independent asset. Deleting one
# asset removes its file and sidecar without affecting other assets with
# the same content hash.
given:
  - dir_album: /e2e_sx/target
    id_as: $album
  - photo: /e2e_sx/src/photo.jpg
    id_as: $photo
    asset_id_as: $asset_id
when:
  # Upload identical content to the target album.
  - upload:
      file: /e2e_sx/src/photo.jpg
      target_album: "${album}"
      on_conflict: rename
    then:
      - response.status: 200
  # Re-index.
  - call: POST /post/index/album
    raw_body: '{"album": "/e2e_sx"}'
    then:
      - response.status: 202
  - wait_index: true
  # Locate the source file.
  - call: POST /get/prefetch?locate=${asset_id}
    capture:
      ts: response.prefetch.timestamp
      idx: response.prefetch.locateTo
      token: response.token
    calc:
      end: "${idx}+1"
  - call: GET /get/get-data?timestamp=${ts}&start=${idx}&end=${end}
    auth: false
    headers:
      Authorization: "Bearer ${token}"
    capture:
      alias_file: response.[0].abstractData.alias.[0].file
  # Write an XMP sidecar for the source file.
  - call: PUT /put/edit_tag
    raw_body: '{"indexArray":[${idx}],"addTagsArray":["sx_tag"],"removeTagsArray":[],"timestamp":${ts}}'
    then:
      - response.status: 200
  # Re-locate after edit.
  - call: POST /get/prefetch?locate=${asset_id}
    capture:
      ts: response.prefetch.timestamp
      idx: response.prefetch.locateTo
      token: response.token
    calc:
      end: "${idx}+1"
  # Delete the source asset.
  - call: DELETE /delete/delete-data
    raw_body: '{"deleteList":[${idx}],"aliasList":["${alias_file}"],"timestamp":${ts}}'
    then:
      - response.status: 200
  # Re-index and check the album.
  - call: POST /post/index/album
    raw_body: '{"album": "/e2e_sx"}'
    then:
      - response.status: 202
  - wait_index: true
  - call: POST /get/prefetch
    body: { Album: "${album}" }
then:
  - response.status: 200
  # The uploaded copy (target/photo.jpeg) still exists.
  - compare:
      response.json.prefetch.dataLength: { ">=": 1 }
  - file_exists: /e2e_sx/target/photo.jpeg
  # The source file and its sidecar are gone.
  - file_absent: /e2e_sx/src/photo.jpg
