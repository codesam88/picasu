name: assign_album on_conflict is required; replace is rejected
# on_conflict is REQUIRED on assign. Missing on_conflict and on_conflict=replace
# are rejected (non-200). skip and rename are accepted.
given:
  - dir_album: /e2e_oc/album
    id_as: $album
  - photo: /e2e_oc/src/p.jpg
    id_as: $src
when:
  # Missing on_conflict → 400
  - call: PUT /put/assign_album
    body:
      hash: "${src}"
      albumId: "${album}"
      alias: "${data_path}/e2e_oc/src/p.jpg"
    then:
      - response.status_not: 200
  # replace is no longer a valid enum value → 400
  - call: PUT /put/assign_album
    body:
      hash: "${src}"
      albumId: "${album}"
      onConflict: "replace"
      alias: "${data_path}/e2e_oc/src/p.jpg"
    then:
      - response.status_not: 200
  # rename: move the file (no collision, so Moved)
  - call: PUT /put/assign_album
    body:
      hash: "${src}"
      albumId: "${album}"
      onConflict: "rename"
      alias: "${data_path}/e2e_oc/src/p.jpg"
    then:
      - response.status: 200
      - response.json.outcome: "moved"
  # skip: same file, now already in album → Skipped
  - call: PUT /put/assign_album
    body:
      hash: "${src}"
      albumId: "${album}"
      onConflict: "skip"
      alias: "${data_path}/e2e_oc/album/p.jpg"
    then:
      - response.status: 200
      - response.json.outcome: "skipped"
then:
  - response.status: 200
  - file_exists: /e2e_oc/album/p.jpg
  - file_absent: /e2e_oc/src/p.jpg
