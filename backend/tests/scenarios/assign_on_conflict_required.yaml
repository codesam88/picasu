name: assign_album on_conflict becomes required; legacy skip and replace are rejected
# Red window: on_conflict is REQUIRED on assign and the legacy values skip and
# replace are removed. Missing on_conflict, on_conflict=skip, and
# on_conflict=replace must each be rejected (non-200). A final rename call
# proves the endpoint still accepts the surviving value.
given:
  - dir_album: /e2e_oc/album
    id_as: $album
  - photo: /e2e_oc/src/p.jpg
    id_as: $src
when:
  - call: PUT /put/assign_album
    body:
      hash: "${src}"
      albumId: "${album}"
      alias: "/e2e_oc/src/p.jpg"
    then:
      - response.status_not: 200
  - call: PUT /put/assign_album
    body:
      hash: "${src}"
      albumId: "${album}"
      onConflict: "skip"
      alias: "/e2e_oc/src/p.jpg"
    then:
      - response.status_not: 200
  - call: PUT /put/assign_album
    body:
      hash: "${src}"
      albumId: "${album}"
      onConflict: "replace"
      alias: "/e2e_oc/src/p.jpg"
    then:
      - response.status_not: 200
  - call: PUT /put/assign_album
    body:
      hash: "${src}"
      albumId: "${album}"
      onConflict: "rename"
      alias: "/e2e_oc/src/p.jpg"
    then:
      - response.status: 200
then:
  - response.status: 200
  - file_exists: /e2e_oc/album/p.jpg
  - file_absent: /e2e_oc/src/p.jpg