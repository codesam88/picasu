name: Unidentifiable upload content is rejected even with content validation off
# Nothing can identify these bytes, so there is no way to tell whether they are
# the image the extension claims. Unlike a mere type mismatch, this is rejected
# regardless of validate_upload_content, and the file is never written.
given:
  - dir_album: /e2e_up_unidx/target
    id_as: $album
  - raw_file: /e2e_up_unidx/src/garbage.jpg
    content: "this is not an image, just arbitrary text bytes"
  - config:
      validate_upload_content: false
when:
  - upload:
      file: /e2e_up_unidx/src/garbage.jpg
      filename: photo.jpg
      target_album: "${album}"
      on_conflict: rename
then:
  - response.status: 400
  - response.json.kind: "InvalidInput"
  - response.json.message: "Uploaded file \"photo.jpg\" is not recognized as jpeg"
  - file_absent: "${data_path}/e2e_up_unidx/target/photo.jpeg"
