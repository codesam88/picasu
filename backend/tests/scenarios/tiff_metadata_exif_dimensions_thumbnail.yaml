name: tiff exif dimensions thumbnail and sidecar xmp reach the metadata detail
# The capability manifest declares TIFF as `exif: [embedded]` and `xmp: [sidecar]`,
# with `xmp:embedded` excluded. This pins the whole positive half of that
# contract on the pinned fixture `tiff-48x32-exif` (see utils/snapfab/fixtures/
# and its manifest entry): the decoded dimensions are the fixture's 48x32, EXIF is
# read out of the file itself (IFD0 tag 0x0131 plus the Exif sub-IFD's
# `DateTimeOriginal`, which ExifTool reports from that sub-IFD), the sidecar XMP
# packet supplies the tags, and a thumbnail is written to disk.
#
# EXIF 0x0131 is the field ExifTool names `ModifyDate`; the retired in-process
# reader called the same tag `DateTime`, and `DateTime` is now EXIF 0x0132, which
# this fixture does not carry. That is why the key is `ModifyDate` and the
# previous reader's key would be absent.
# The negative control is `tiff_without_xmp_source_has_no_tags`, and the PNG
# counterpart of this path is `png_metadata_exif_dimensions_thumbnail`.
given:
  - fixture:
      source: tiff-48x32-exif
      destination: /e2e_tiff_meta/photo.tif
    id_as: $photo
    asset_id_as: $asset_id
  - raw_file: /e2e_tiff_meta/photo.xmp
    content: |
      <x:xmpmeta xmlns:x="adobe:ns:meta/">
      <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
      <rdf:Description xmlns:dc="http://purl.org/dc/elements/1.1/">
      <dc:subject><rdf:Bag>
      <rdf:li>e2e_tiff_sidecar_alpine</rdf:li>
      <rdf:li>e2e_tiff_sidecar_winter</rdf:li>
      </rdf:Bag></dc:subject>
      </rdf:Description>
      </rdf:RDF>
      </x:xmpmeta>
when:
  - call: POST /get/prefetch?locate=${asset_id}
    capture:
      token: response.token
      ts: response.prefetch.timestamp
  - call: GET /get/metadata/${asset_id}?timestamp=${ts}
    auth: false
    headers:
      Authorization: "Bearer ${token}"
then:
  - response.status: 200
  - response.json.ext: tif
  - response.json.width: 48
  - response.json.height: 32
  - response.json.exifVec.ModifyDate: "2024-05-06 07:08:09"
  - response.json.exifVec.DateTimeOriginal: "2024-05-06 07:08:09"
  - response.json.tags:
      contains: e2e_tiff_sidecar_alpine
  - response.json.tags:
      contains: e2e_tiff_sidecar_winter
  - thumb_exists: $photo
  - file_exists: e2e_tiff_meta/photo.tif
