name: restore a trashed album by assigning it back to its parent
# Restore on the trash page is not a dedicated untrash endpoint: for albums it
# is move_album_into_album via PUT /put/assign_album, targeting the original
# parent album. Trashing a whole album moves its directory into .trash/ and
# rewrites every child record's path (rewrite_paths_under); assigning the
# trashed album back to its parent must reverse that — the directory (with its
# photo) returns to the original location and the child alias paths follow.
given:
  - dir_album: /e2e_restore_album/source
    id_as: $source
  - dir_album: /e2e_restore_album/source/child
    id_as: $child
  - photo: /e2e_restore_album/source/child/photo.jpg
    id_as: $photo

when:
  - call: POST /get/prefetch?locate=${child}
    capture:
      ts: response.prefetch.timestamp
      idx: response.prefetch.locateTo
  - call: DELETE /delete/delete-data
    raw_body: '{"deleteList":[{"index":${idx},"aliasPath":"${image_home}/e2e_restore_album/source/child"}],"timestamp":${ts}}'
    then:
      - response.status: 200
      - file_absent: /e2e_restore_album/source/child
      - file_exists: /.trash/child/photo.jpg
  - call: PUT /put/assign_album
    body:
      hash: "${child}"
      albumId: "${source}"
    then:
      - response.status: 200
then:
  - response.status: 200
  - file_exists: /e2e_restore_album/source/child/photo.jpg
  - file_absent: /.trash/child
