name: restore cleans empty parent trash albums
# Trashing a photo inside a nested album hierarchy mirrors the full path under
# .trash/. Restoring the photo with cleanupEmptySource purges every empty
# intermediate directory that the restore leaves behind.
given:
  - dir_album: /e2e_purge_nested/outer
    id_as: $outer
  - dir_album: /e2e_purge_nested/outer/inner
    id_as: $inner
  - photo: /e2e_purge_nested/outer/inner/photo.jpg
    id_as: $photo
when:
  - call: POST /get/prefetch?locate=${photo}
    capture:
      ts: response.prefetch.timestamp
      idx: response.prefetch.locateTo
  - call: DELETE /delete/delete-data
    raw_body: '{"deleteList":[{"index":${idx},"aliasPath":"${image_home}/e2e_purge_nested/outer/inner/photo.jpg"}],"timestamp":${ts}}'
    then:
      - response.status: 200
      - file_absent: /e2e_purge_nested/outer/inner/photo.jpg
      - file_exists: /.trash/e2e_purge_nested/outer/inner/photo.jpg
  - call: PUT /put/assign_album
    body:
      hash: "${photo}"
      albumId: "${inner}"
      onConflict: "rename"
      cleanupEmptySource: true
    then:
      - response.status: 200
then:
  - file_exists: /e2e_purge_nested/outer/inner/photo.jpg
  - file_absent: /.trash/e2e_purge_nested/outer/inner
  - file_absent: /.trash/e2e_purge_nested/outer
  - file_absent: /.trash/e2e_purge_nested
