name: delete rejects a non-null aliasList entry for an album record
# Album records may only be deleted via a null aliasList entry; a non-null
# alias path on an album is invalid and must return 400 InvalidInput.
given:
  - dir_album: /e2e_alb/vacation
    id_as: $album_id
when:
  - call: POST /get/prefetch?locate=${album_id}
    capture:
      ts: response.prefetch.timestamp
      idx: response.prefetch.locateTo
  # Non-null alias entry against an Album record.
  - call: DELETE /delete/delete-data
    raw_body: '{"deleteList":[${idx}],"aliasList":["/e2e_alb/vacation/photo.jpg"],"timestamp":${ts}}'
then:
  - response.status: 400
  - response.json.kind: "InvalidInput"
  # The album directory is still on disk.
  - file_exists: /e2e_alb/vacation