name: assign_album on_conflict=merge dedups a byte-identical file with a different name into the album-resident copy
# Headline merge behavior (red window): the selected source file has the same
# content (same blake3 hash) as an alias already resident in the target album
# dir. Merge must delete the redundant source copy + its alias entry, leaving a
# single album-resident alias; it must NOT create a second file.
given:
  - dir_album: /e2e_mdd/album
    id_as: $album
  - photo: /e2e_mdd/src/same.jpg
    id_as: $src
when:
  # Place a byte-identical copy of the source into the album (upload reads the
  # same on-disk bytes, so the blake3 hashes match and the record gains a second
  # alias: [src/same.jpg, album/photo.jpeg]).
  - upload:
      file: /e2e_mdd/src/same.jpg
      filename: photo.jpg
      target_album: "${album}"
      on_conflict: rename
    then:
      - response.status: 200
  # Re-index so the dedup task merges the album copy into the source record.
  - call: POST /post/index/album
    raw_body: '{"album": "/e2e_mdd"}'
    then:
      - response.status: 202
  - wait_index: true
  # Merge: source has an identical-content alias already inside the album dir,
  # so the redundant source copy is removed, not moved.
  - call: PUT /put/assign_album
    body:
      hash: "${src}"
      albumId: "${album}"
      onConflict: "merge"
      alias: "/e2e_mdd/src/same.jpg"
    then:
      - response.status: 200
  # Probe the DB: only the album-resident alias remains.
  - call: GET /get/test/record/${src}
then:
  - response.status: 200
  - response.json.aliases.[0].file: "${data_path}/e2e_mdd/album/photo.jpeg"
  - file_exists: /e2e_mdd/album/photo.jpeg
  - file_absent: /e2e_mdd/src/same.jpg