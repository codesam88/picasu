name: tags modifiable via edit tag api
# After edit_tag, the stored tag must be readable back — via the metadata
# detail endpoint (list rows no longer carry tags; Phase 14).
given:
  - photo: /e2e_p/photo.jpg
    id_as: $photo
    asset_id_as: $asset_id
when:
  - call: POST /get/prefetch?locate=${asset_id}
    capture:
      token: response.token
      ts: response.prefetch.timestamp
      idx: response.prefetch.locateTo
  - call: PUT /put/edit_tag
    raw_body: '{"indexArray":[${idx}],"addTagsArray":["e2e_p_added"],"removeTagsArray":[],"timestamp":${ts}}'
    then:
      - response.status: 200
  - call: POST /get/prefetch?locate=${asset_id}
    capture:
      token: response.token
      ts: response.prefetch.timestamp
      idx: response.prefetch.locateTo
  - call: GET /get/metadata/${asset_id}?timestamp=${ts}
    auth: false
    headers:
      Authorization: "Bearer ${token}"
then:
  - response.status: 200
  - response.json.tags:
      contains: e2e_p_added
