name: valid hash token serves compressed image
# A ClaimsHash token whose hash matches the content hash must be accepted
# by GuardHash for the compressed image endpoint.
given:
  - dir_album: /e2e_hash/album
    id_as: $album
  - photo: /e2e_hash/album/photo.jpg
    id_as: $photo
    asset_id_as: $asset_id
when:
  - call: POST /post/index/album
    raw_body: '{"album": "/e2e_hash"}'
    then:
      - response.status: 202
  - wait_index: true
  # Fetch data to get the hash token for the photo.
  - call: POST /get/prefetch?locate=${asset_id}
    capture:
      ts: response.prefetch.timestamp
      idx: response.prefetch.locateTo
      token: response.token
    calc:
      end: "${idx}+1"
  - call: GET /get/get-data?timestamp=${ts}&start=${idx}&end=${end}
    auth: false
    headers:
      Authorization: "Bearer ${token}"
    capture:
      hash_token: response.[0].token
      content_hash: response.[0].abstractData.id
      ext: response.[0].abstractData.ext
    then:
      - response.status: 200
  # Use the hash token to fetch the compressed image.
  - call: "GET /object/compressed/${content_hash:0:2}/${content_hash}.jpg"
    auth: false
    headers:
      Authorization: "Bearer ${hash_token}"
then:
  - response.status: 200
