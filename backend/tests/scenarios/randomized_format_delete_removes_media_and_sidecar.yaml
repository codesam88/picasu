name: seeded random format deletes its media and sidecar
# The deletion half of the randomized matrix, once per seed in the `ci` set. The
# file is placed by `random_media` (so the seed decides the format) with a
# sidecar beside it, and the whole flow is asserted without naming a format:
#
#   DELETE /delete/delete-data  removes the asset by id, whatever it wraps.
#   prefetch locateTo: null     the record is gone from the index, not just from
#                               disk.
#   file_absent                 the media file goes, and so does `asset.xmp` next
#                               to it. The sidecar name does not depend on the
#                               media's extension, so this holds for every selected
#                               format.
#
# What is deliberately *not* asserted: `thumb_absent`. Thumbnail cleanup on
# delete is an image-only contract, and the randomized set has to stay
# format-independent:
#
#   AbstractData::Image::compressed_path() is the thumbnail
#     (`object/compressed/<prefix>/<hash>.jpg`), so `delete_data` removes it.
#   AbstractData::Video::compressed_path() is the *compressed video*
#     (`.../<hash>.mp4`), so `delete_data` removes that path and leaves the
#     `.jpg` thumbnail `process::video::generate_thumbnail_for_video` wrote.
#
# Whether deleting a video should also drop its thumbnail is a product decision
# this scenario does not make in either direction; the image-only contract is
# pinned by `dup_final_delete_removes_state`. If that gap is closed, the
# assertion moves here.
#
# The positive half (the sidecar reaches the index at all, for every format) is
# `randomized_format_indexes_and_serves_metadata`.
randomize:
  seeds: ci
given:
  - random_media: /e2e_rand_del/asset
    id_as: $photo
    asset_id_as: $asset_id
  - raw_file: /e2e_rand_del/asset.xmp
    content: |
      <x:xmpmeta xmlns:x="adobe:ns:meta/">
      <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
      <rdf:Description xmlns:dc="http://purl.org/dc/elements/1.1/">
      <dc:subject><rdf:Bag>
      <rdf:li>e2e_rand_del_sidecar_alpine</rdf:li>
      </rdf:Bag></dc:subject>
      </rdf:Description>
      </rdf:RDF>
      </x:xmpmeta>
when:
  - call: POST /get/prefetch?locate=${asset_id}
    capture:
      ts: response.prefetch.timestamp
  - call: DELETE /delete/delete-data
    raw_body: '{"assetIds":["${asset_id}"],"timestamp":${ts}}'
    then:
      - response.status: 200
  - call: POST /get/prefetch?locate=${asset_id}
then:
  - response.status: 200
  - response.json.prefetch.locateTo: null
  - file_absent: e2e_rand_del/asset.${ext}
  - file_absent: e2e_rand_del/asset.xmp
