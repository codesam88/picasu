name: delete rejects request when aliasList length differs from deleteList length
# When aliasList is provided its length must equal the deleteList length;
# otherwise the endpoint returns 400 InvalidInput and nothing is deleted.
given:
  - photo: /e2e_len/photo.jpg
    id_as: $photo
when:
  - call: POST /get/prefetch?locate=${photo}
    capture:
      ts: response.prefetch.timestamp
      idx: response.prefetch.locateTo
  # Two aliases for a single-record delete: length 2 != deleteList length 1.
  - call: DELETE /delete/delete-data
    raw_body: '{"deleteList":[${idx}],"aliasList":["/e2e_len/a.jpg","/e2e_len/b.jpg"],"timestamp":${ts}}'
then:
  - response.status: 400
  - response.json.kind: "InvalidInput"
  # The file is still on disk.
  - file_exists: /e2e_len/photo.jpg