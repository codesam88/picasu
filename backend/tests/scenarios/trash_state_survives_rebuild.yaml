name: soft-delete state survives a database rebuild
# The durability half of the trash contract. `PUT /put/edit_flags` sets a flag
# on the asset record, and trash's whole semantic is that the file stays on
# disk for recovery — so a rebuild from the filesystem (the operator action
# the schema-migration message names, and the recovery path after losing
# `DATA_HOME`) sees a normal file. Without a durable marker it silently
# undeletes everything that was in the trash.
#
# This scenario pins that the flag is written to the item's sidecar, and that
# a rebuild reads it back: the asset is still trashed afterwards, and only a
# restore (which removes the marker) brings it back as a normal asset. The
# assertions after the rebuild are the reported failure mode — before the
# sidecar marker, the trashed photo came back as `isTrashed: false` and the
# `Trashed: true` listing was empty.
#
# The rebuilt asset is discovered by path, not by the id the first index
# issued: rebuild assigns a fresh random `asset_id`.
given:
  - dir_album: /e2e_trash/pool
    id_as: $album
  - photo: /e2e_trash/pool/photo.jpg
    id_as: $photo
    asset_id_as: $asset_id
when:
  # ── soft-delete through the API, exactly as the UI Delete action does ──
  - call: POST /get/prefetch?locate=${asset_id}
    capture:
      ts: response.prefetch.timestamp
      idx: response.prefetch.locateTo
  - call: PUT /put/edit_flags
    raw_body: '{"indexArray":[${idx}],"timestamp":${ts},"isTrashed":true}'
    then:
      - response.status: 200
      # The flag reached the sidecar — the durable half of the edit.
      - file_exists: /e2e_trash/pool/photo.xmp
  # ── the database-loss vector: rows rebuilt from the filesystem ──
  - call: POST /post/rebuild
    then:
      - response.status: 200
    asset_id_as: $asset_after
    discover_path: e2e_trash/pool/photo.jpg
  - call: POST /get/prefetch?locate=${asset_after}
    capture:
      token: response.token
      ts2: response.prefetch.timestamp
      idx2: response.prefetch.locateTo
  - call: GET /get/metadata/${asset_after}?timestamp=${ts2}
    auth: false
    headers:
      Authorization: "Bearer ${token}"
    then:
      # Still trashed: the rebuild read the flag back out of the sidecar.
      - response.json.path.isTrashed: true
  # ── restore: the marker must leave with the flag ──
  - call: PUT /put/edit_flags
    raw_body: '{"indexArray":[${idx2}],"timestamp":${ts2},"isTrashed":false}'
    then:
      - response.status: 200
  - call: POST /post/rebuild
    then:
      - response.status: 200
    asset_id_as: $asset_restored
    discover_path: e2e_trash/pool/photo.jpg
  - call: POST /get/prefetch?locate=${asset_restored}
    capture:
      token3: response.token
      ts3: response.prefetch.timestamp
  - call: GET /get/metadata/${asset_restored}?timestamp=${ts3}
    auth: false
    headers:
      Authorization: "Bearer ${token3}"
    then:
      # A normal asset again, and by the same durable route: restore deleted
      # the marker rather than keeping it as history.
      - response.json.path.isTrashed: false
then:
  - response.status: 200
