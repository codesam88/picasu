name: png without any xmp source has no tags
# Negative control for `png_sidecar_xmp_tags`: a PNG with no sidecar and no
# embedded packet must end up with an empty tag set. Nothing about PNG indexing
# may require a tag source, and this also proves the sidecar keywords in that
# scenario came from the sidecar file rather than from anything the PNG bytes
# supplied — a generated PNG that was never tagged carries no XMP packet at all.
given:
  - photo: /e2e_png_noxmp/photo.png
    format: png
    id_as: $photo
    asset_id_as: $asset_id
when:
  - call: POST /get/prefetch?locate=${asset_id}
    capture:
      token: response.token
      ts: response.prefetch.timestamp
  - call: GET /get/metadata/${asset_id}?timestamp=${ts}
    auth: false
    headers:
      Authorization: "Bearer ${token}"
then:
  - response.status: 200
  - response.json.tags: []
