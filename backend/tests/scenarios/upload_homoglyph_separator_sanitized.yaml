name: Upload with a fullwidth-slash homoglyph in the filename is sanitized
given:
  - dir_album: /e2e_up_homoglyph/target
    id_as: $album
  - photo: /e2e_up_homoglyph/src/photo.jpg
when:
  - upload:
      file: /e2e_up_homoglyph/src/photo.jpg
      filename: "photo／cat.jpg"
      target_album: "${album}"
      on_conflict: rename
then:
  - response.status: 200
  - file_exists: /e2e_up_homoglyph/target/photocat.jpeg
  - file_absent: /e2e_up_homoglyph/target/photo／cat.jpeg
