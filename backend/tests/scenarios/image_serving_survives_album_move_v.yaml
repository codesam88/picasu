name: image_serving_survives_album_move
given:
  - dir_album: /e2e_v/album
    id_as: $album
  - photo: /e2e_v/photo.jpg
    id_as: $photo
    asset_id_as: $asset_id
when:
  - call: PUT /put/assign_album
    body:
      assetId: "${asset_id}"
      albumId: "${album}"
      onConflict: "rename"
      alias: "${data_path}/e2e_v/photo.jpg"
    then:
      - response.status: 200
then:
  - serve_image_ok: $photo
