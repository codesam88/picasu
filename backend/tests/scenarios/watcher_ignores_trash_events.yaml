name: watcher ignores filesystem events under trash directory
given:
  - photo: /e2e_watcher_trash/photo.jpg
    id_as: $photo
when:
  - call: POST /get/prefetch?locate=${photo}
    capture:
      ts: response.prefetch.timestamp
      idx: response.prefetch.locateTo
  - call: DELETE /delete/delete-data
    raw_body: '{"deleteList":[{"index":${idx},"aliasPath":"${image_home}/e2e_watcher_trash/photo.jpg"}],"timestamp":${ts}}'
    then:
      - response.status: 200
      - file_exists: /e2e_watcher_trash/.trash/photo.jpg
  - call: POST /get/prefetch?locate=${image_home}/e2e_watcher_trash/.trash/photo.jpg
then:
  - response.status: 200
