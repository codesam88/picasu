name: mp4 ffprobe container metadata dimensions and thumbnail reach the metadata detail
# Source attribution for every field asserted below. MP4/MOV UUID metadata and
# ffprobe metadata are separate contracts, and this scenario keeps them apart:
#
#   exifVec.*                  ffprobe. `exif.rs::generate_exif_for_video` runs
#                              `ffprobe -v error -show_format -show_streams` and
#                              parses stdout into this map. It is NOT EXIF: the
#                              backend never opens a video with kamadak-exif.
#   width / height (top level) ffprobe, via `video.rs::video_width_height`
#                              (`-select_streams v:0 -show_entries stream=width`).
#   ext                         the extension of the stored file, not a probe result.
#   tags                        the sidecar `clip.xmp` alone. The pinned mp4 bytes
#                              carry no Adobe XMP `uuid` box and no XMP markup at
#                              all (`pinned_video_fixtures_carry_no_embedded_xmp_packet`),
#                              so nothing here can come from the container.
#   thumbnail                   ffmpeg, frame 0, scaled to the fixture's 48x32.
#
# `format_name` is deliberately the value ffprobe reports for the whole ISO-BMFF
# group, identical for the mp4 and mov fixtures. `TAG:major_brand` — read from the
# `ftyp` box by ffprobe — is the field that tells them apart, and it is what
# proves the bytes under test really are MP4 rather than QuickTime.
# Negative control: `mp4_without_xmp_source_has_no_tags`.
#
# There is deliberately no furtherMetadata attribution line, because a video has
# no further-data bucket. Decided, not deferred: a video's `exifVec` above is
# ffprobe's *whole* output — format, streams and tags flattened into one map — so
# a bucket could only be carved back out of it, putting one read-only surface in
# two sections with nothing reading the difference. The image path is the case
# that needs the bucket: its `exifVec` is the EXIF family alone, which is what
# leaves anything over for one. Decision recorded in
# `process::xmp::native_metadata_for`, `process::index::process_video_info` and
# `ImageMetadata::further_metadata`; the open question and its resolution are in
# `.plan/test-exif-xmp-handling.md` -> "Additional Known Scope Gaps". Revisit
# only if video extraction is ever split the way the image path's is.
given:
  - fixture:
      source: mp4-48x32-ffprobe
      destination: /e2e_mp4_meta/clip.mp4
    id_as: $photo
    asset_id_as: $asset_id
  - raw_file: /e2e_mp4_meta/clip.xmp
    content: |
      <x:xmpmeta xmlns:x="adobe:ns:meta/">
      <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
      <rdf:Description xmlns:dc="http://purl.org/dc/elements/1.1/">
      <dc:subject><rdf:Bag>
      <rdf:li>e2e_mp4_sidecar_alpine</rdf:li>
      <rdf:li>e2e_mp4_sidecar_winter</rdf:li>
      </rdf:Bag></dc:subject>
      </rdf:Description>
      </rdf:RDF>
      </x:xmpmeta>
when:
  - call: POST /get/prefetch?locate=${asset_id}
    capture:
      token: response.token
      ts: response.prefetch.timestamp
  - call: GET /get/metadata/${asset_id}?timestamp=${ts}
    auth: false
    headers:
      Authorization: "Bearer ${token}"
then:
  - response.status: 200
  - response.json.ext: mp4
  - response.json.width: 48
  - response.json.height: 32
  - response.json.exifVec.format_name: "mov,mp4,m4a,3gp,3g2,mj2"
  - response.json.exifVec.format_long_name: "QuickTime / MOV"
  - response.json.exifVec.nb_streams: "1"
  - response.json.exifVec.codec_name: h264
  - response.json.exifVec.codec_type: video
  - response.json.exifVec.codec_tag_string: avc1
  - response.json.exifVec.pix_fmt: yuv420p
  - response.json.exifVec.width: "48"
  - response.json.exifVec.height: "32"
  - "response.json.exifVec.TAG:major_brand": isom
  - "response.json.exifVec.TAG:handler_name": VideoHandler
  # Decision pin for the absent further-data bucket (rationale in the header).
  # `VideoMetadata` has no `further_metadata` field, so the key is not in the
  # response at all — which is what `absent` asserts, and is the honest spelling:
  # the previous `: null` could not tell a missing key from an explicit null.
  # Give a video a bucket — any entries, or even an empty map — and this fails
  # loudly, on the value *and* on the key being present at all.
  - response.json.furtherMetadata: absent
  - response.json.tags:
      contains: e2e_mp4_sidecar_alpine
  - response.json.tags:
      contains: e2e_mp4_sidecar_winter
  - thumb_exists: $photo
  - file_exists: e2e_mp4_meta/clip.mp4
