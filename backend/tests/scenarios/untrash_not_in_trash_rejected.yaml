name: untrash non-trashed item is rejected
given:
  - photo: /e2e_untrash_reject/photo.jpg
    id_as: $photo
when:
  - call: POST /get/prefetch?locate=${photo}
    capture:
      ts: response.prefetch.timestamp
      idx: response.prefetch.locateTo
  - call: PUT /put/restore-from-trash
    raw_body: '{"restoreList":[{"index":${idx},"aliasPath":"${image_home}/e2e_untrash_reject/photo.jpg"}],"timestamp":${ts}}'
then:
  - response.status_not: 200
  - file_exists: /e2e_untrash_reject/photo.jpg
