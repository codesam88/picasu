name: deleting parent and child albums together removes the complete tree
given:
  - dir_album: /e2e_multi_delete/parent
    id_as: $parent_album
  - dir_album: /e2e_multi_delete/parent/child
    id_as: $child_album
  - photo: /e2e_multi_delete/parent/photo.jpg
  - photo: /e2e_multi_delete/parent/child/photo.jpg
when:
  - call: POST /post/index/album
    raw_body: '{"album": "/e2e_multi_delete"}'
    then:
      - response.status: 202
  - wait_index: true
  - call: POST /get/prefetch?locate=${parent_album}
    capture:
      ts: response.prefetch.timestamp
  - call: DELETE /delete/delete-data
    raw_body: '{"assetIds":["${parent_album}","${child_album}"],"timestamp":${ts}}'
    then:
      - response.status: 200
  - call: POST /post/index/album
    raw_body: '{"album": "/e2e_multi_delete"}'
    then:
      - response.status: 202
  - wait_index: true
then:
  - response.status: 200
  - file_absent: /e2e_multi_delete/parent
  - file_absent: /e2e_multi_delete/parent/child
  - file_absent: /e2e_multi_delete/parent/photo.jpg
  - file_absent: /e2e_multi_delete/parent/child/photo.jpg
