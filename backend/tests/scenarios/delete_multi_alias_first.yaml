name: deleting one file of same-hash pair leaves the other intact
# Path-primary contract: each file is an independent asset. Deleting one
# file's asset does not affect the other file.
given:
  - dir_album: /e2e_dup/target
    id_as: $album
  - photo: /e2e_dup/src/photo.jpg
    id_as: $photo
when:
  # Upload identical content to the target album.
  - upload:
      file: /e2e_dup/src/photo.jpg
      target_album: "${album}"
      on_conflict: rename
    then:
      - response.status: 200
  # Re-index.
  - call: POST /post/index/album
    raw_body: '{"album": "/e2e_dup"}'
    then:
      - response.status: 202
  - wait_index: true
  # Locate the source file.
  - call: POST /get/prefetch?locate=${photo}
    capture:
      ts: response.prefetch.timestamp
      idx: response.prefetch.locateTo
      token: response.token
    calc:
      end: "${idx}+1"
  - call: GET /get/get-data?timestamp=${ts}&start=${idx}&end=${end}
    auth: false
    headers:
      Authorization: "Bearer ${token}"
    capture:
      alias_file: response.[0].abstractData.alias.[0].file
  # Delete the source file's asset.
  - call: DELETE /delete/delete-data
    raw_body: '{"deleteList":[${idx}],"aliasList":["${alias_file}"],"timestamp":${ts}}'
    then:
      - response.status: 200
  # Re-index after delete.
  - call: POST /post/index/album
    raw_body: '{"album": "/e2e_dup"}'
    then:
      - response.status: 202
  - wait_index: true
  # Verify the uploaded copy still exists in the target album.
  - call: POST /get/prefetch
    body: { Album: "${album}" }
then:
  - response.status: 200
  - compare:
      response.json.prefetch.dataLength: { ">=": 1 }
  - file_exists: /e2e_dup/target/photo.jpeg
  - file_absent: /e2e_dup/src/photo.jpg
