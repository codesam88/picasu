name: restore via assign_album renames when destination file already exists
# Covers the trash-page "Restore" action with a colliding filename at the
# destination: response of the frontend's rename restore. The target album
# already holds a same-named photo, so on_conflict=rename must write
# photo-001.jpg rather than overwrite or skip. cleanupEmptySource purges
# the empty trash directory after restore.
given:
  - dir_album: /e2e_untrash_conflict/album
    id_as: $album
  - photo: /e2e_untrash_conflict/album/photo.jpg
    id_as: $photo
  - photo: /e2e_untrash_conflict/import/photo.jpg
    id_as: $imported
when:
  - call: POST /get/prefetch?locate=${photo}
    capture:
      ts: response.prefetch.timestamp
      idx: response.prefetch.locateTo
  - call: DELETE /delete/delete-data
    raw_body: '{"deleteList":[{"index":${idx},"aliasPath":"${image_home}/e2e_untrash_conflict/album/photo.jpg"}],"timestamp":${ts}}'
    then:
      - response.status: 200
      - file_absent: /e2e_untrash_conflict/album/photo.jpg
      - file_exists: /.trash/e2e_untrash_conflict/album/photo.jpg
  - call: PUT /put/assign_album
    body:
      hash: "${imported}"
      albumId: "${album}"
      onConflict: "skip"
    then:
      - response.status: 200
      - file_exists: /e2e_untrash_conflict/album/photo.jpg
  - call: PUT /put/assign_album
    body:
      hash: "${photo}"
      albumId: "${album}"
      onConflict: "rename"
      cleanupEmptySource: true
then:
  - response.status: 200
  - file_absent: /.trash/e2e_untrash_conflict/album/photo.jpg
  - file_absent: /.trash/e2e_untrash_conflict/album
  - file_absent: /.trash/e2e_untrash_conflict
  - file_exists: /e2e_untrash_conflict/album/photo-001.jpg
  - file_exists: /e2e_untrash_conflict/album/photo.jpg
