name: "negative: deleting unknown asset_id returns error"
given:
  - dir_album: /e2e_neg_album/album
    id_as: $album
when:
  - call: POST /post/index/album
    raw_body: '{"album": "/e2e_neg_album"}'
    then:
      - response.status: 202
  - wait_index: true
  # Attempt to delete a non-existent asset_id.
  - call: POST /get/prefetch
    body: { Album: "${album}" }
    capture:
      ts: response.prefetch.timestamp
  - call: DELETE /delete/delete-data
    raw_body: '{"assetIds":["nonexistent_asset_id_12345"],"timestamp":${ts}}'
then:
  # Unknown asset_id returns 404.
  - response.status: 404
