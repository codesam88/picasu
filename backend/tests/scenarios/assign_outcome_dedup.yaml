name: assign_album merge dedup reports deduplicatedRemoved outcome
# Outcome-contract: when merge prunes a redundant source copy (byte-identical
# album-resident alias), the response body must report deduplicatedRemoved and
# the physical source must be gone while the album-resident copy survives.
given:
  - dir_album: /e2e_ocd_/album
    id_as: $album
  - photo: /e2e_ocd_/src/same.jpg
    id_as: $src
when:
  # Place a byte-identical copy of the source into the album so the record gains
  # a second alias: [src/same.jpg, album/photo.jpeg].
  - upload:
      file: /e2e_ocd_/src/same.jpg
      filename: photo.jpg
      target_album: "${album}"
      on_conflict: rename
    then:
      - response.status: 200
  # Re-index so the dedup task merges the album copy into the source record.
  - call: POST /post/index/album
    raw_body: '{"album": "/e2e_ocd_"}'
    then:
      - response.status: 202
  - wait_index: true
  # Merge selects the redundant source; dedup prunes it. This is the final when,
  # so its response.json.outcome is asserted.
  - call: PUT /put/assign_album
    body:
      hash: "${src}"
      albumId: "${album}"
      onConflict: "merge"
      alias: "${data_path}/e2e_ocd_/src/same.jpg"
then:
  - response.status: 200
  - response.json.outcome: deduplicatedRemoved
  - file_absent: /e2e_ocd_/src/same.jpg
  - file_exists: /e2e_ocd_/album/photo.jpeg