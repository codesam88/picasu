name: "path-primary delete: same-hash files are independent assets"
# Path-primary contract: each physical file has its own asset record.
# Deleting one record affects only that file. Same-hash siblings are
# unaffected and retain their own records, paths, and thumbnails.
given:
  - dir_album: /e2e_dup/target
    id_as: $album
  - photo: /e2e_dup/src/photo.jpg
    id_as: $photo
    asset_id_as: $asset_id
when:
  # Upload identical content to the target album — creates a second record.
  - upload:
      file: /e2e_dup/src/photo.jpg
      target_album: "${album}"
      on_conflict: rename
    then:
      - response.status: 200
  # Re-index so the tree snapshot reflects both records.
  - call: POST /post/index/album
    raw_body: '{"album": "/e2e_dup"}'
    then:
      - response.status: 202
  - wait_index: true
  # Locate src/photo.jpg by its asset_id and delete it.
  - call: POST /get/prefetch?locate=${asset_id}
    capture:
      ts: response.prefetch.timestamp
      idx: response.prefetch.locateTo
      token: response.token
    calc:
      end: "${idx}+1"
  - call: GET /get/get-data?timestamp=${ts}&start=${idx}&end=${end}
    auth: false
    headers:
      Authorization: "Bearer ${token}"
    capture:
      alias_file: response.[0].abstractData.alias.[0].file
  - call: DELETE /delete/delete-data
    raw_body: '{"deleteList":[${idx}],"aliasList":["${alias_file}"],"timestamp":${ts}}'
    then:
      - response.status: 200
  # Verify the album still has the uploaded copy (target/photo.jpeg).
  - call: POST /get/prefetch
    body: { Album: "${album}" }
then:
  - response.status: 200
  # Album has placeholder + target/photo.jpeg = at least 1 item.
  - compare:
      response.json.prefetch.dataLength: { ">=": 1 }
  # src/photo.jpg is gone from disk.
  - file_absent: /e2e_dup/src/photo.jpg
  # target/photo.jpeg still exists on disk.
  - file_exists: /e2e_dup/target/photo.jpeg
