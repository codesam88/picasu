name: tags visible via metadata detail
# Tags are no longer carried on get-data list rows (Phase 14 lean payload);
# they are served by GET /get/metadata/{assetId} — this scenario pins the
# original "tags visible via API" intent to that detail read.
given:
  - photo: /e2e_o/tagged.jpg
    tags:
      - e2e_o_family
      - e2e_o_vacation
    id_as: $photo
    asset_id_as: $asset_id
when:
  - call: POST /get/prefetch?locate=${asset_id}
    capture:
      token: response.token
      ts: response.prefetch.timestamp
  - call: GET /get/metadata/${asset_id}?timestamp=${ts}
    auth: false
    headers:
      Authorization: "Bearer ${token}"
then:
  - response.status: 200
  - response.json.tags:
      contains: e2e_o_family
  - response.json.tags:
      contains: e2e_o_vacation
