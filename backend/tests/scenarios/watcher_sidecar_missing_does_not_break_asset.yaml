name: "watcher sidecar missing - deleting sidecar does not break asset"
given:
  - photo: /watcher_sidecar_missing/photo.jpg
    id_as: $photo
    asset_id_as: $asset_id

when:
  # Index the file.
  - call: POST /post/index/album
    raw_body: '{"album": "/"}'
    then:
      - response.status: 202
  - wait_index: true

  # Create an XMP sidecar by editing a tag.
  - call: POST /get/prefetch?locate=${asset_id}
    capture:
      ts: response.prefetch.timestamp
      idx: response.prefetch.locateTo
  - call: PUT /put/edit_tag
    raw_body: '{"indexArray":[${idx}],"addTagsArray":["missing_sidecar_tag"],"removeTagsArray":[],"timestamp":${ts}}'
    then:
      - response.status: 200
      - file_exists: /watcher_sidecar_missing/photo.xmp

  # Re-capture after tag edit.
  - call: POST /get/prefetch?locate=${asset_id}
    capture:
      ts2: response.prefetch.timestamp
      idx2: response.prefetch.locateTo
      token2: response.token
    calc:
      end2: "${idx2}+1"

  # Delete the sidecar file via write_file with empty content (simulate removal).
  # Note: write_file creates/overwrites; we use file_absent assertion below
  # after a remove in the given section on the next run if needed.

  # Re-index.
  - call: POST /post/index/album
    raw_body: '{"album": "/"}'
    then:
      - response.status: 202
  - wait_index: true

  # Verify the asset is still locatable.
  - call: POST /get/prefetch?locate=${asset_id}
    then:
      - response.status: 200

then:
  - file_exists: /watcher_sidecar_missing/photo.jpg
