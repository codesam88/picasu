name: a failed sidecar read rolls back the sidecars the request already wrote
# The read-side twin of
# `a_failed_tag_edit_rolls_back_the_sidecars_it_had_already_written`.
#
# Before overwriting a sidecar, the request reads it: the previous bytes are the
# only record of what was in the file, and without them there is no way to undo
# the write. That read can fail on its own — a sidecar left write-only by
# whatever put it there — and it fails a request the same way a write does, in
# the same place in the batch, so the sidecar the request already wrote has to
# be put back.
#
# The unreadable file is the second target's, so the first target's write is
# already in its file when the failure is found. The directory stays writable
# throughout: only the one file is muted, so nothing here depends on the
# directory refusing a write.
#
# The second photo's *cache* is not asserted. Muting a file is a metadata
# change, and while the mode is off a reindex of that photo would read nothing
# from it — a reindex the app is right to do, but one that would make the
# assertion about the cache a race. That the failing item's payload is not
# stored is pinned at unit level instead
# (`a_sidecar_that_cannot_be_read_rolls_back_the_batch_written_before_it`,
# which asserts the store closure never runs).
given:
  - photo: /e2e_ro_read/first/first.jpg
    id_as: $first
    asset_id_as: $first_id
  - raw_file: /e2e_ro_read/first/first.xmp
    content: |
      <?xpacket begin="" id="W5M0MpCehiHzreSzNTczkc9d"?>
      <x:xmpmeta xmlns:x="adobe:ns:meta/">
      <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
      <rdf:Description rdf:about=""
        xmlns:dc="http://purl.org/dc/elements/1.1/"
        xmlns:xmp="http://ns.adobe.com/xap/1.0/">
        <dc:subject><rdf:Bag><rdf:li>e2e_read_seed_tag</rdf:li></rdf:Bag></dc:subject>
      </rdf:Description>
      </rdf:RDF>
      </x:xmpmeta>
      <?xpacket end="w"?>
  - photo: /e2e_ro_read/second/second.jpg
    id_as: $second
    asset_id_as: $second_id
  - raw_file: /e2e_ro_read/second/second.xmp
    content: |
      <?xpacket begin="" id="W5M0MpCehiHzreSzNTczkc9d"?>
      <x:xmpmeta xmlns:x="adobe:ns:meta/">
      <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
      <rdf:Description rdf:about=""
        xmlns:dc="http://purl.org/dc/elements/1.1/"
        xmlns:xmp="http://ns.adobe.com/xap/1.0/">
        <dc:subject><rdf:Bag><rdf:li>e2e_read_seed_tag</rdf:li></rdf:Bag></dc:subject>
      </rdf:Description>
      </rdf:RDF>
      </x:xmpmeta>
      <?xpacket end="w"?>
when:
  # One index per photo, from two prefetches of the same unfiltered tree. Both
  # snapshots hold the same items in the same order — only `locate` differs —
  # so the second one carries the index of the first photo too.
  - call: POST /get/prefetch?locate=${first_id}
    capture:
      idx_first: response.prefetch.locateTo
  - call: POST /get/prefetch?locate=${second_id}
    capture:
      ts: response.prefetch.timestamp
      idx_second: response.prefetch.locateTo
  # Write-only: the sidecar can be replaced but not read, so the request cannot
  # record what is in it before it overwrites it.
  - chmod:
      path: /e2e_ro_read/second/second.xmp
      octal: "0200"
  - call: PUT /put/edit_tag
    raw_body: '{"indexArray":[${idx_first},${idx_second}],"addTagsArray":["e2e_read_added"],"removeTagsArray":["e2e_read_seed_tag"],"timestamp":${ts}}'
    then:
      - response.status: 500
  # Readable again, so the assertions below can read the file and the shared
  # reset is not the only thing standing between this and the next scenario.
  - chmod:
      path: /e2e_ro_read/second/second.xmp
      octal: "0600"
  - call: POST /get/prefetch?locate=${first_id}
    capture:
      token: response.token
      ts: response.prefetch.timestamp
    then:
      - response.status: 200
  - call: GET /get/metadata/${first_id}?timestamp=${ts}
    auth: false
    headers:
      Authorization: "Bearer ${token}"
then:
  - response.status: 200
  # The first photo's edit reached its sidecar and was then taken back: the
  # cache never saw it, so neither may the file.
  - response.json.tags:
      contains: e2e_read_seed_tag
  - response.json.tags:
      not_contains: e2e_read_added
  - file.contains: /e2e_ro_read/first/first.xmp
    text: e2e_read_seed_tag
  - file.not_contains: /e2e_ro_read/first/first.xmp
    text: e2e_read_added
  # And the file that could not be read is the one the request refused to
  # overwrite, so it is still the packet the seed wrote.
  - file.contains: /e2e_ro_read/second/second.xmp
    text: e2e_read_seed_tag
  - file.not_contains: /e2e_ro_read/second/second.xmp
    text: e2e_read_added
